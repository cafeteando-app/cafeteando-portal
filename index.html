<script>
/* Framework de formularios, validaciones y direcciones */
/* ---------- formularios: campos, validación, ojito ---------- */
const FD={},TOUCH={};const MISMATCH='Las contraseñas no coinciden.';
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
const RULES={
 req:v=>v.trim()?'':'Necesitamos este dato para continuar.',
 email:v=>!v.trim()||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?'':'Parece que falta algo en el email. Debería verse como nombre@dominio.com.',
 cuit:v=>!v.trim()||v.replace(/\D/g,'').length===11?'':'El CUIT debe tener 11 dígitos (ej: 20-12345678-9).',
 phone:v=>!v.trim()||/^\d{8,13}$/.test(v.replace(/[\s\-+()]/g,''))?'':'Necesitamos un teléfono con código de área, solo números (ej: 11 1234-5678).',
 url:v=>!v.trim()||/^https?:\/\/\S+\.\S+/.test(v.trim())?'':'Pegá el link completo, que empieza con https:// (ej: https://maps.app.goo.gl/...)',
 insta:v=>!v.trim()||/^@?[A-Za-z0-9._]{1,30}$/.test(v.trim())?'':'Usuario de Instagram inválido (ej: @tucafeteria).',
 pass:v=>v.length>=8&&/[A-Za-z]/.test(v)&&/\d/.test(v)?'':'Mínimo 8 caracteres, con al menos una letra y un número.',
 max240:v=>v.length<=240?'':'Máximo 240 caracteres.',
 max200:v=>v.length<=200?'':'Máximo 200 caracteres.',
 social:v=>!v.trim()||/^@?[A-Za-z0-9._]{1,30}$/.test(v.trim())||/^(https?:\/\/)?[\w-]+(\.[\w-]+)+\S*$/.test(v.trim())?'':'Podés escribir un usuario (@tucafeteria) o un link (https://...).'};
function check(el){const rules=(el.dataset.rules||'').split(',').filter(Boolean);
 for(const r of rules){if(r==='match'){const o=document.getElementById(el.dataset.match);if(el.value!==(o?o.value:''))return MISMATCH;continue}const m=RULES[r](el.value);if(m)return m}return ''}
function showErr(el,msg){el.classList.toggle('invalid',!!msg);el.setAttribute('aria-invalid',msg?'true':'false');const b=document.getElementById('err-'+el.id);if(b)b.textContent=msg===MISMATCH?'':msg}
function fld(o){const id=o.id,rules=o.rules||'',req=rules.split(',').includes('req');const v=FD[id]!==undefined?FD[id]:(o.def||'');
 const lab=`<label for="${id}">${o.label}${req?' <span class="req" aria-hidden="true">*</span><span class="sr"> (obligatorio)</span>':''}</label>`;
 const c=`id="${id}" data-f data-rules="${rules}" ${o.match?`data-match="${o.match}"`:''} aria-describedby="err-${id}${o.hint?' hint-'+id:''}" ${req?'aria-required="true"':''} ${o.ph?`placeholder="${o.ph}"`:''} ${o.max?`maxlength="${o.max}"`:''} ${o.ac?`autocomplete="${o.ac}"`:''} ${o.list?`list="${o.list}"`:''}`;
 let ctl;
 if(o.tag==='textarea')ctl=`<textarea ${c} rows="${o.rows||3}">${esc(v)}</textarea>`;
 else if(o.tag==='select')ctl=`<select ${c}><option value="">${o.ph||'Falta elegir una opción'}</option>${o.opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
 else if(o.eye)ctl=`<div class="pw"><input type="password" ${c} value="${esc(v)}"><button type="button" class="eye" data-eye="${id}" aria-label="Mostrar contraseña" aria-pressed="false">${EYE}</button></div>`;
 else ctl=`<input type="${o.type||'text'}" ${c} value="${esc(v)}">`;
 return `<div class="field">${lab}${ctl}${o.list?`<datalist id="${o.list}">${o.listOpts.map(x=>`<option value="${x}">`).join('')}</datalist>`:''}${o.hint?`<div class="hint" id="hint-${id}">${o.hint}</div>`:''}<div class="ferr" id="err-${id}" role="alert"></div></div>`}
function validateGroup(root){let first=null;
 root.querySelectorAll('[data-f]').forEach(el=>{TOUCH[el.id]=1;const m=check(el);showErr(el,m);if(m&&!first)first=el});
 const ad=root.querySelector('[data-addr-in]');if(ad&&!addrSel){TOUCH.ad_in=1;showAddrErr('Para ubicarla en el mapa, elegí una dirección de la lista.');if(!first)first=ad}
 if(first){first.focus();first.scrollIntoView&&first.scrollIntoView({block:'center'})}return !first}
function setRule(id,ok){const e=document.getElementById(id);if(e)e.classList.toggle('ok',!!ok)}
function onField(el){const p1=document.getElementById('r_p1'),p2=document.getElementById('r_p2');if(!p1||!p2)return;
 const a=p1.value,b=p2.value;setRule('pr-len',a.length>=8);setRule('pr-mix',/[A-Za-z]/.test(a)&&/\d/.test(a));
 const m=document.getElementById('pr-match');
 if(b){if(a===b){m.textContent='Las contraseñas coinciden';m.className='pmatch ok'}else{m.textContent=MISMATCH;m.className='pmatch bad'}}else{m.textContent='';m.className='pmatch'}
 if(el&&el.id==='r_p1'&&(b||TOUCH.r_p2))showErr(p2,check(p2))}
function bindForms(){
 document.querySelectorAll('[data-f]').forEach(el=>{
  el.addEventListener('input',()=>{FD[el.id]=el.value;if(TOUCH[el.id]||el.classList.contains('invalid'))showErr(el,check(el));onField(el)});
  el.addEventListener('change',()=>{FD[el.id]=el.value;if(el.id==='ob_rol'){render();const n=document.getElementById('ob_rol');n&&n.focus()}if(el.id==='ad_prov'){const cb=curBarrio();if(el.value===CABA){if(!BARRIOS.includes(cb))FD.ad_b=''}else if(BARRIOS.includes(cb))FD.ad_b='';render();const n=document.getElementById('ad_prov');n&&n.focus()}});
  el.addEventListener('blur',()=>{TOUCH[el.id]=1;showErr(el,check(el));onField(el)});
  if(TOUCH[el.id])showErr(el,check(el))});
 document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);const show=i.type==='password';i.type=show?'text':'password';b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.innerHTML=show?EYEOFF:EYE});
 onField(null);bindAddr()}

/* ---------- dirección con autocompletado y mapa ---------- */
const BARRIOS=['Agronomía','Almagro','Balvanera','Barracas','Belgrano','Boedo','Caballito','Chacarita','Coghlan','Colegiales','Constitución','Flores','Floresta','La Boca','La Paternal','Liniers','Mataderos','Monte Castro','Montserrat','Nueva Pompeya','Núñez','Palermo','Parque Avellaneda','Parque Chacabuco','Parque Chas','Parque Patricios','Puerto Madero','Recoleta','Retiro','Saavedra','San Cristóbal','San Nicolás','San Telmo','Vélez Sarsfield','Versalles','Villa Crespo','Villa del Parque','Villa Devoto','Villa General Mitre','Villa Lugano','Villa Luro','Villa Ortúzar','Villa Pueyrredón','Villa Real','Villa Riachuelo','Villa Santa Rita','Villa Soldati','Villa Urquiza'];
const ADDRS=[['Bonpland 1500','Palermo'],['Bonpland 1620','Palermo'],['Thames 1800','Palermo'],['Honduras 4800','Palermo'],['Av. Cabildo 2200','Belgrano'],['Av. Cabildo 2450','Belgrano'],['Av. Corrientes 5100','Villa Crespo'],['Scalabrini Ortiz 1200','Villa Crespo'],['Defensa 900','San Telmo'],['Av. Santa Fe 2900','Recoleta'],['Av. Rivadavia 4200','Almagro'],['Av. Juan B. Justo 3000','Colegiales'],['Av. Rivadavia 5100','Caballito'],['Av. del Libertador 7500','Núñez']];
const PROVS=["Ciudad Autónoma de Buenos Aires", "Buenos Aires", "Catamarca", "Chaco", "Chubut", "Córdoba", "Corrientes", "Entre Ríos", "Formosa", "Jujuy", "La Pampa", "La Rioja", "Mendoza", "Misiones", "Neuquén", "Río Negro", "Salta", "San Juan", "San Luis", "Santa Cruz", "Santa Fe", "Santiago del Estero", "Tierra del Fuego", "Tucumán"];
const CABA='Ciudad Autónoma de Buenos Aires';
const curBarrio=()=>FD.ad_b!==undefined?FD.ad_b:(addrSel?addrSel.b:'');
let addrSel={a:'Bonpland 1500',b:'Palermo'},addrText='',pin={x:52,y:46};
function showAddrErr(m){const i=document.getElementById('ad_in');if(!i)return;i.classList.toggle('invalid',!!m);i.setAttribute('aria-invalid',m?'true':'false');const b=document.getElementById('err-ad_in');if(b)b.textContent=m}
function addrField(){const sel=addrSel;const v=sel?(sel.custom?sel.a:sel.a+', '+sel.b):addrText;const bval=FD.ad_b!==undefined?FD.ad_b:(sel?sel.b:'');
 return `<div class="field addrf"><label for="ad_in">Dirección <span class="req" aria-hidden="true">*</span><span class="sr"> (obligatorio)</span></label><div class="addrwrap"><input id="ad_in" data-addr-in autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ad_list" aria-describedby="hint-ad_in err-ad_in" aria-required="true" placeholder="Empezá a escribir calle y número" value="${esc(v)}"><ul id="ad_list" class="sugg" role="listbox" aria-label="Direcciones sugeridas" hidden></ul></div><div class="hint" id="hint-ad_in">Falta elegir una opción de la lista para ubicar tu local en el mapa. Si tu cafetería está en otra localidad, escribí la dirección completa y elegí "Usar como dirección": te avisamos cuando lleguemos a tu zona. ${api.live?'':'(Simulado: en producción se conecta a un servicio de direcciones.)'}</div><div class="ferr" id="err-ad_in" role="alert"></div></div>
 <div class="grid g2">${fld({id:'ad_prov',label:'Provincia',rules:'req',tag:'select',opts:PROVS,def:(sel&&!sel.custom)?CABA:'',ph:'Falta elegir una provincia'})}${(()=>{const pv=FD.ad_prov!==undefined?FD.ad_prov:((sel&&!sel.custom)?CABA:'');return pv===CABA?fld({id:'ad_b',label:'Barrio',rules:'req',tag:'select',opts:(bval&&!BARRIOS.includes(bval))?BARRIOS.concat([bval]):BARRIOS,def:bval,ph:'Falta elegir un barrio'}):fld({id:'ad_b',label:'Ciudad o localidad',rules:'req',def:bval,ph:'Ej: Rosario',ac:'off'})})()}</div>
 ${sel?`<div class="mapbox"><div class="map" data-map-area><div class="pin" data-pin tabindex="0" role="img" aria-label="Pin de ubicación. Arrastralo o usá las flechas para ajustarlo." style="left:${pin.x}%;top:${pin.y}%"><svg viewBox="0 0 24 32" width="30" height="40" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20 12 32 12 32s12-12 12-20.3C24 5.2 18.6 0 12 0z" fill="#A96649"/><circle cx="12" cy="11.5" r="4.5" fill="#fff"/></svg></div></div><p class="hint" style="margin-top:6px">¿Confirmás que el pin está sobre tu local? Podés arrastrarlo para ajustarlo.</p></div>`:''}`}
const nzS=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function admFrom(a){const ad=a.address||{};const st=nzS(ad.state);let prov=PROVS.find(p=>nzS(p)===st);
 if(!prov&&(st.includes('ciudad autonoma')||(nzS(ad.city)==='buenos aires'&&!ad.state_district)))prov=CABA;
 let b='';
 if(prov===CABA){const cands=[ad.suburb,ad.neighbourhood,ad.quarter,ad.city_district,ad.borough,ad.village].filter(Boolean).map(nzS);
  b=BARRIOS.find(x=>cands.includes(nzS(x)))||BARRIOS.find(x=>cands.some(c=>c.includes(nzS(x))))||BARRIOS.find(x=>nzS(a.display_name).split(',').map(t=>t.trim()).includes(nzS(x)))||''}
 else b=ad.city||ad.town||ad.village||ad.municipality||ad.suburb||'';
 return{prov,b}}
// Direcciones repetidas (CABA / provincia / otras ciudades): se le muestran las opciones y elige la suya.
async function geoCands(q){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=25&addressdetails=1&countrycodes=ar&accept-language=es&q='+encodeURIComponent(q+', Argentina'));const a=await r.json();const seen=new Set();
 return (a||[]).filter(x=>x.address&&(x.address.house_number||x.address.road)).map(x=>{const m=admFrom(x);const ad=x.address;const loc=m.prov===CABA?(m.b||ad.suburb||'CABA'):(m.b||ad.city||ad.town||'');const label=[(ad.road||'')+(ad.house_number?' '+ad.house_number:''),loc,m.prov===CABA?'CABA':(m.prov||ad.state||'')].filter(Boolean).join(', ');return{x,m,label}}).filter(c=>!seen.has(c.label)&&seen.add(c.label)).sort((p,q2)=>{const rk=c=>c.m.prov===CABA?0:(c.m.prov==='Buenos Aires'?1:2);return rk(p)-rk(q2)}).slice(0,8)}catch(e){return[]}}
function bindAddr(){const inp=document.querySelector('[data-addr-in]');if(!inp)return;const list=document.getElementById('ad_list');let act=-1,items=[];
 const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant');act=-1};
 const mark=()=>{[...list.querySelectorAll('li[data-ai]')].forEach((li,i)=>li.classList.toggle('act',i===act));if(act>=0)inp.setAttribute('aria-activedescendant','ad_o'+act)};
 const open=q=>{items=(api.live?[]:ADDRS).filter(a=>(a[0]+' '+a[1]).toLowerCase().includes(q.trim().toLowerCase())).slice(0,6);
  if(q.trim().length>=3)items.push('use');list.innerHTML=items.map((a,i)=>a==='use'?`<li role="option" id="ad_o${i}" data-ai="${i}" class="use">${api.live?'Ubicar «'+esc(q.trim())+'» en el mapa':'Usar «'+esc(q.trim())+'» como dirección (otra localidad)'}</li>`:`<li role="option" id="ad_o${i}" data-ai="${i}"><b>${a[0]}</b> <small>${a[1]}, CABA</small></li>`).join('')||'<li class="none" role="option" aria-disabled="true">Seguí escribiendo la calle y el número.</li>';
  list.hidden=false;inp.setAttribute('aria-expanded','true');act=-1;
  list.querySelectorAll('li[data-ai]').forEach(li=>{li.onmousedown=e=>e.preventDefault();li.onclick=()=>pick(+li.dataset.ai)})};
 const pick=i=>{if(items[i]==='use'&&api.live){const q=inp.value.trim();list.innerHTML='<li class="none" role="option" aria-disabled="true">Buscando la dirección…</li>';
   geoCands(q).then(cs=>{if(!cs.length){addrSel={a:q,b:'',custom:1};addrText='';pin={x:52,y:46};FD.ad_prov=CABA;FD.ad_b='';TOUCH.ad_in=0;render();return}
    list.innerHTML='<li class="none" role="option" aria-disabled="true">Elegí cuál es tu dirección:</li>'+cs.map((c,k)=>`<li role="option" data-ci="${k}"><b>${esc(c.label)}</b></li>`).join('');list.hidden=false;
    list.querySelectorAll('li[data-ci]').forEach(li=>{li.onmousedown=e=>e.preventDefault();li.onclick=()=>{const c=cs[+li.dataset.ci];const ad=c.x.address;addrSel={a:q,b:c.m.b,custom:1,fromCand:1};addrText='';pin={lat:+c.x.lat,lng:+c.x.lon,moved:true,orig:{lat:+c.x.lat,lng:+c.x.lon}};if(c.m.prov)FD.ad_prov=c.m.prov;FD.ad_b=c.m.b;TOUCH.ad_in=0;render();const n=document.getElementById('ad_in');if(n)n.focus()}})});return}
  if(items[i]==='use'){addrSel={a:inp.value.trim(),b:FD.ad_b||'',custom:1};addrText='';pin={x:52,y:46};if(api.live){FD.ad_prov=CABA;FD.ad_b='';addrSel.b=''}TOUCH.ad_in=0;render();const n=document.getElementById('ad_b');n&&n.focus();return}const a=items[i];addrSel={a:a[0],b:a[1]};addrText='';FD.ad_b=a[1];FD.ad_prov=CABA;pin={x:52,y:46};TOUCH.ad_in=0;render();const n=document.getElementById('ad_in');if(n)n.focus()};
 inp.addEventListener('input',()=>{addrText=inp.value;if(addrSel){addrSel=null;const m=document.querySelector('.mapbox');if(m)m.remove()}showAddrErr('');if(inp.value.trim().length>=2)open(inp.value);else close()});
 inp.addEventListener('keydown',e=>{if(list.hidden)return;const n=list.querySelectorAll('li[data-ai]').length;if(e.key==='ArrowDown'){e.preventDefault();act=(act+1)%Math.max(n,1);mark()}else if(e.key==='ArrowUp'){e.preventDefault();act=(act-1+n)%Math.max(n,1);mark()}else if(e.key==='Enter'&&act>=0){e.preventDefault();pick(act)}else if(e.key==='Escape'){e.stopPropagation();close()}});
 inp.addEventListener('blur',()=>{setTimeout(close,150);if(!addrSel&&TOUCH.ad_in!==0&&inp.value.trim())showAddrErr('Para ubicarla en el mapa, elegí una dirección de la lista.')});
 const pn=document.querySelector('[data-pin]'),mp=document.querySelector('[data-map-area]');
 realMap();bindLocalidad();if(pn&&mp){const set=(x,y)=>{pin.x=Math.max(4,Math.min(96,x));pin.y=Math.max(8,Math.min(96,y));pn.style.left=pin.x+'%';pn.style.top=pin.y+'%'};
  pn.addEventListener('pointerdown',e=>{e.preventDefault();pn.setPointerCapture&&pn.setPointerCapture(e.pointerId);const mv=ev=>{const r=mp.getBoundingClientRect();if(r.width)set((ev.clientX-r.left)/r.width*100,(ev.clientY-r.top)/r.height*100)};const up=()=>{pn.removeEventListener('pointermove',mv);pn.removeEventListener('pointerup',up)};pn.addEventListener('pointermove',mv);pn.addEventListener('pointerup',up)});
  pn.addEventListener('keydown',e=>{const d={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];if(d){e.preventDefault();set(pin.x+d[0],pin.y+d[1])}})}}

// Mapa real (OpenStreetMap + Leaflet): el pin se ve sobre la calle y se puede arrastrar.
function realMap(){const box=document.querySelector('[data-map-area]');if(!box||typeof LF==='undefined'||box.dataset.real)return;box.dataset.real='1';
 const old=box.querySelector('[data-pin]');if(old)old.remove();box.style.background='none';box.style.height='260px';
 const map=LF.map(box,{zoomControl:true,scrollWheelZoom:false}).setView(pin.lat?[pin.lat,pin.lng]:[-34.6037,-58.3816],pin.lat?17:12);
 LF.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 const hp=box.parentNode&&box.parentNode.querySelector('.hint');let nt=document.getElementById('pin_note');if(!nt&&hp){nt=document.createElement('p');nt.id='pin_note';nt.className='hint';nt.style.cssText='margin-top:4px;color:var(--terracota)';hp.after(nt)}
 const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
 const note=()=>{if(!nt)return;const d=pin.orig&&pin.lat?dist(pin.orig,pin):0;nt.textContent=d>150?'El pin quedó a unos '+Math.round(d/10)*10+' m de la dirección que elegiste. Si tu local está ahí, está todo bien; si no, acercalo a la dirección.':''};
 if(hp)hp.textContent='¿Confirmás que el pin está sobre tu local? Podés arrastrarlo o tocar el mapa para ajustarlo. La provincia y el barrio se completan solos según la dirección que elegiste.';
 if(addrSel&&addrSel.fromCand){const t='Se completó según la dirección elegida. Para cambiarlo, buscá otra dirección.';const pe=document.getElementById('ad_prov');if(pe){pe.disabled=true;pe.title=t}const be=document.getElementById('ad_b');if(be&&be.value){if(be.tagName==='SELECT')be.disabled=true;else be.readOnly=true;be.title=t}}
 const mk=LF.marker(map.getCenter(),{draggable:true}).addTo(map);
 mk.on('dragend',()=>{const c=mk.getLatLng();pin.lat=c.lat;pin.lng=c.lng;pin.moved=true;note()});
 map.on('click',e=>{mk.setLatLng(e.latlng);pin.lat=e.latlng.lat;pin.lng=e.latlng.lng;pin.moved=true;note()});
 const norm=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 const run=async q=>{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&countrycodes=ar&accept-language=es&q='+encodeURIComponent(q));const a=await r.json();return a&&a[0]};
 const fill=a=>{const x=admFrom(a);const ch=(x.prov&&FD.ad_prov!==x.prov)||FD.ad_b!==x.b;if(x.prov)FD.ad_prov=x.prov;FD.ad_b=x.b;if(addrSel)addrSel.b=x.b;if(ch)render()};
 const place=async(manual)=>{const val=id=>{const e=document.getElementById(id);return e?e.value:''};const auto=!manual&&!!(addrSel&&addrSel.custom);
  const q=[addrSel&&addrSel.a,val('ad_b'),val('ad_prov'),'Argentina'].filter(Boolean).join(', ');
  try{let a=await run(q);if(!a&&auto)a=await run((addrSel.a||'')+', Argentina');
   if(a){pin.lat=+a.lat;pin.lng=+a.lon;pin.orig={lat:pin.lat,lng:pin.lng};if(auto)pin.moved=true;mk.setLatLng([pin.lat,pin.lng]);map.setView([pin.lat,pin.lng],17);if(auto)fill(a)}}catch(e){}};
 if(pin.lat){mk.setLatLng([pin.lat,pin.lng])}else place();
 ['ad_b','ad_prov'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('change',()=>{if(addrSel&&addrSel.fromCand)return;pin.lat=null;pin.moved=true;place(true)})});
 setTimeout(()=>map.invalidateSize(),200)}


// Otras provincias: sugerencias de localidades (Georef, API oficial del Estado argentino). Se baja la lista de la provincia una vez y se filtra acá.
const PROV_ID={'Buenos Aires':'06','Catamarca':'10','Chaco':'22','Chubut':'26','Córdoba':'14','Corrientes':'18','Entre Ríos':'30','Formosa':'34','Jujuy':'38','La Pampa':'42','La Rioja':'46','Mendoza':'50','Misiones':'54','Neuquén':'58','Río Negro':'62','Salta':'66','San Juan':'70','San Luis':'74','Santa Cruz':'78','Santa Fe':'82','Santiago del Estero':'86','Tierra del Fuego':'94','Tucumán':'90'};
const LOCS={};
function bindLocalidad(){if(!api.live)return;const inp=document.getElementById('ad_b');if(!inp||inp.tagName!=='INPUT'||inp.dataset.loc)return;inp.dataset.loc='1';
 let dl=document.getElementById('ad_b_dl');if(!dl){dl=document.createElement('datalist');dl.id='ad_b_dl';document.body.appendChild(dl)}inp.setAttribute('list','ad_b_dl');
 const nz=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const prov=()=>{const e=document.getElementById('ad_prov');return e?e.value:''};
 const get=async()=>{const p=prov(),id=PROV_ID[p];if(!id)return[];if(!LOCS[p]){try{const r=await fetch('https://apis.datos.gob.ar/georef/api/localidades?max=5000&campos=nombre&orden=nombre&provincia='+id);const j=await r.json();LOCS[p]=[...new Set((j.localidades||[]).map(x=>x.nombre))]}catch(e){return[]}}return LOCS[p]};
 const show=async()=>{const q=nz(inp.value.trim());const all=await get();const a=q?all.filter(n=>nz(n).startsWith(q)).concat(all.filter(n=>!nz(n).startsWith(q)&&nz(n).includes(q))):all;dl.innerHTML=a.slice(0,15).map(n=>`<option value="${esc(n)}"></option>`).join('')};
 inp.addEventListener('input',show);inp.addEventListener('focus',show)}

<script>
/* Funciones reales (modo supabase) para: edición de locales aprobados, interruptor, invitaciones,
   equipo, actividad, resumen y política de revisión. En modo mock no hace nada. */
const LIVE_ADMIN = { summary: null, team: [], activity: [], cafes: [], policy: [] };
const ACT_TXT = {
  request_pending: 'Envió una solicitud', request_approved: 'Aprobó', request_rejected: 'Rechazó', request_needs_fix: 'Pidió correcciones',
  change_direct: 'Cambió horarios/cupo (directo)', merchant_on: 'Activó su local', merchant_off: 'Desactivó su local', admin_on: 'Activó en la app',
  admin_off: 'Desactivó de la app', invite_created: 'Creó una invitación', invite_claimed: 'Reclamó su local', admin_added: 'Agregó un admin',
  admin_removed: 'Quitó un admin', policy_changed: 'Cambió la política de revisión',
};
const FIELD_ES = { name: 'Nombre', address: 'Dirección', neighborhood: 'Barrio', maps_url: 'Link de Maps', description: 'Descripción', logo_url: 'Logo', photos: 'Fotos',
  services: 'Servicios', other_services: 'Otros servicios', schedule: 'Horarios', daily_stock: 'Cupo diario', province: 'Provincia' };

const rpcErr = (e) => {
  const m = (e && e.message) || '';
  const T = { NOT_APPROVED: 'Ese local todavía no está aprobado.', NOT_ENABLED_BY_ADMIN: 'Cafeteando todavía no habilitó tu local para figurar en la app.',
    COOLDOWN: 'Para evitar cambios repetidos, probá de nuevo en unos minutos.', STOCK_MIN: 'El cupo mínimo es de 5 cafés por día.', FORBIDDEN: 'No tenés permiso para esta acción.',
    INVITE_INVALID: 'La invitación no es válida o ya fue usada.', INVITE_EMAIL_MISMATCH: 'Esta invitación es para otro email. Ingresá con el mail al que te la enviamos.',
    ALREADY_CLAIMED: 'Ese local ya fue reclamado.', INVALID_EMAIL: 'El email no es válido.', CANNOT_REMOVE_SELF: 'No podés quitarte a vos mismo.', NOT_PENDING: 'Esa solicitud ya no está pendiente.' };
  for (const k in T) if (m.includes(k)) return T[k];
  return 'No pudimos completar la acción. Probá de nuevo.';
};

Object.assign(api, {
  async _rpc(name, args) {
    try { const r = await api._client().rpc(name, args || {}); return r.error ? { ok: false, error: rpcErr(r.error) } : { ok: true, data: r.data }; }
    catch (e) { return { ok: false, error: rpcErr(e) }; }
  },
  submitChange: (p) => api._rpc('submit_change', { p_payload: p }),
  myPendingChange: () => api._rpc('my_pending_change'),
  approveChange: (id) => api._rpc('admin_approve_change', { p_request_id: id }),
  setMyActive: (on) => api._rpc('set_my_cafe_active', { p_active: !!on }),
  adminCafes: () => api._rpc('admin_list_cafes'),
  invite: (cafe, email) => api._rpc('admin_create_invitation', { p_cafe: cafe, p_email: email }),
  revokeInvite: (cafe) => api._rpc('admin_revoke_invitation', { p_cafe: cafe }),
  claim: (token) => api._rpc('claim_cafe', { p_token: token }),
  adminSummary: () => api._rpc('admin_summary'),
  adminTeam: () => api._rpc('admin_team'),
  adminActivity: () => api._rpc('admin_activity', { p_limit: 30 }),
  addAdmin: (email, role) => api._rpc('admin_add_admin', { p_email: email, p_role: role }),
  removeAdmin: (email) => api._rpc('admin_remove_admin', { p_email: email }),
  setPolicy: (field, mode) => api._rpc('admin_set_field_policy', { p_field: field, p_mode: mode }),
  async policy() {
    try { const r = await api._client().from('field_review_policy').select('field,mode,label').order('label'); return r.error ? [] : (r.data || []); } catch (e) { return []; }
  },
});

async function liveLoadAdmin() {
  const [s, t, a, c, p] = await Promise.all([api.adminSummary(), api.adminTeam(), api.adminActivity(), api.adminCafes(), api.policy()]);
  LIVE_ADMIN.summary = s.ok ? s.data : null; LIVE_ADMIN.team = t.ok ? t.data : []; LIVE_ADMIN.activity = a.ok ? a.data : [];
  LIVE_ADMIN.cafes = c.ok ? c.data : []; LIVE_ADMIN.policy = p;
}

const fmtDT = (d) => { const x = new Date(d), p = (n) => String(n).padStart(2, '0'); return p(x.getDate()) + '/' + p(x.getMonth() + 1) + ' ' + p(x.getHours()) + ':' + p(x.getMinutes()); };
const siteLink = (token) => { const b = (window.PORTAL_CONFIG && window.PORTAL_CONFIG.siteUrl) || (location.origin + location.pathname); return b + '?invite=' + token; };

/* ---------- Admin: vistas reales ---------- */
const _mockResumen = adminResumen, _mockEquipo = adminEquipo, _mockDet = adminDet;
adminResumen = function () {
  if (!api.live) return _mockResumen();
  const s = LIVE_ADMIN.summary || {};
  const pend = REQ.filter((r) => r.s === 'pendiente');
  return `<div class="top"><div><h1>Resumen</h1><p class="muted">Vista general de la red.</p></div></div>
  <div class="card" style="border-left:4px solid var(--warn)"><h2>Requiere atención</h2><ul class="log" style="margin-top:8px">${
    pend.length ? pend.map((r) => `<li><span class="badge b-pendiente">${r.chg ? 'Cambio' : 'Nueva'}</span> ${esc(r.n)} espera revisión desde el ${esc(r.f)}</li>`).join('') : '<li>No hay nada pendiente.</li>'}</ul></div>
  ${kgrid('Red de comercios', [['Locales en la app', s.active_cafes ?? '—', 'de ' + (s.total_cafes ?? '—') + ' cargados'], ['Solicitudes nuevas', s.pending ?? '—', 'Esperando revisión'],
    ['Cambios pendientes', s.pending_changes ?? '—', 'De locales ya aprobados'], ['Comercios registrados', s.merchants ?? '—', 'Con cuenta en el portal']])}
  ${kgrid('Estado de solicitudes', [['A corregir', s.needs_fix ?? '—'], ['Aprobadas', s.approved ?? '—'], ['Rechazadas', s.rejected ?? '—'], ['', '']])}`;
};

adminEquipo = function () {
  if (!api.live) return _mockEquipo();
  const T = LIVE_ADMIN.team, A = LIVE_ADMIN.activity, P = LIVE_ADMIN.policy;
  return `<div class="top"><div><h1>Equipo</h1><p class="muted">Quién de Cafeteando puede entrar al panel. Cada acción queda registrada.</p></div></div>
  <div class="card"><h2>Personas con acceso</h2><table><tr><th>Email</th><th>Rol</th><th>Estado</th><th></th></tr>${T.map((x) => `<tr><td><b>${esc(x.email)}</b></td><td>${x.role === 'admin' ? 'Administrador' : 'Revisor'}</td><td>${x.registered ? '<span class="badge b-aprobado">Activo</span>' : '<span class="badge b-pendiente">Falta que se registre</span>'}</td><td><button class="btn sm bad" data-rmadm="${esc(x.email)}">Quitar</button></td></tr>`).join('')}</table>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:end"><div class="field" style="margin:0;min-width:240px"><label for="nadm">Agregar persona</label><input id="nadm" type="email" placeholder="email@ejemplo.com"></div>
  <select id="nadmr" aria-label="Rol"><option value="reviewer">Revisor</option><option value="admin">Administrador</option></select><button class="btn" data-addadm>Agregar</button></div>
  <p class="hint" style="margin-top:8px">La persona tiene que crear su cuenta en el portal con ese mismo email y verificarlo.</p></div>
  <div class="card"><h2>Qué cambios necesitan revisión</h2><p class="muted" style="margin:4px 0 12px">Cuando un local ya aprobado cambia estos datos: "Directo" se publica al instante; "Revisión" espera tu aprobación.</p>
  <table><tr><th>Dato</th><th>Cómo se publica</th></tr>${P.map((f) => `<tr><td>${esc(f.label)}</td><td><select data-pol="${esc(f.field)}" aria-label="${esc(f.label)}"><option value="review" ${f.mode === 'review' ? 'selected' : ''}>Revisión</option><option value="direct" ${f.mode === 'direct' ? 'selected' : ''}>Directo</option></select></td></tr>`).join('')}</table></div>
  <div class="card"><h2>Registro de actividad</h2><table><tr><th>Fecha</th><th>Quién</th><th>Qué hizo</th></tr>${A.length ? A.map((a) => `<tr><td>${fmtDT(a.at)}</td><td><b>${esc(a.actor_email || '—')}</b></td><td>${esc(ACT_TXT[a.action] || a.action)}${a.detail && a.detail.name ? ': ' + esc(a.detail.name) : ''}${a.detail && a.detail.email ? ': ' + esc(a.detail.email) : ''}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">Todavía no hay actividad.</td></tr>'}</table></div>`;
};

function liveInvit() {
  const C = LIVE_ADMIN.cafes;
  return `<div class="top"><div><h1>Invitaciones</h1><p class="muted">Locales ya cargados en la app. Invitá al dueño con su email: crea su clave en el portal y reclama su local. Copiá el link y mandáselo.</p></div></div>
  <div class="card"><table><tr><th>Local</th><th>Barrio</th><th>En la app</th><th>Estado</th><th></th></tr>${C.map((c) => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.neighborhood || '—')}</td><td>${c.active ? 'Sí' : 'No'}</td>
  <td>${c.claimed ? '<span class="badge b-aprobado">Reclamado</span>' : c.invite ? `<span class="badge b-pendiente">Invitado: ${esc(c.invite.email)}</span>` : '<span class="badge b-borrador">Sin invitar</span>'}</td>
  <td>${c.claimed ? '' : c.invite ? `<button class="btn sm sec" data-copyinv="${c.invite.token}">Copiar link</button> <button class="btn sm bad" data-revinv="${c.id}">Anular</button>` : `<button class="btn sm" data-inv="${c.id}" data-invn="${esc(c.name)}">Invitar</button>`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No hay locales.</td></tr>'}</table></div>`;
}

adminDet = function (r) {
  if (!api.live || !r || !r.chg) return _mockDet(r);
  const rows = Object.keys(r.changes || {}).map((k) => {
    const v = r.changes[k];
    const txt = Array.isArray(v) ? (k === 'photos' ? v.length + ' fotos' : (k === 'schedule' ? 'Horarios actualizados' : v.join(', '))) : (k === 'logo_url' ? 'Logo nuevo' : String(v));
    return `<tr><td><b>${esc(FIELD_ES[k] || k)}</b></td><td>${esc(txt)}</td></tr>`;
  }).join('');
  return `<div class="top"><div><h1>Cambios de ${esc(r.n)}</h1><p class="muted">Enviados el ${esc(r.f)}. Mientras no los aprobés, la app muestra la versión publicada.</p></div></div>
  <div class="card"><h2>Qué cambió</h2><table><tr><th>Dato</th><th>Nuevo valor</th></tr>${rows || '<tr><td colspan="2" class="muted">Sin datos.</td></tr>'}</table></div>
  <div class="card" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" data-chgok>Aprobar y publicar cambios</button><button class="btn warn" data-dec="corr">Pedir correcciones</button><button class="btn bad" data-dec="rej">Rechazar</button></div>`;
};

function liveBind() {
  const $a = (s, f) => document.querySelectorAll(s).forEach(f);
  const reload = async (msg) => { await liveLoadRequests(); await liveLoadAdmin(); render(); if (msg) toast(msg); };
  $a('[data-addadm]', (b) => (b.onclick = async () => {
    const e = ($('#nadm').value || '').trim(), r = $('#nadmr').value;
    const x = await api.addAdmin(e, r); if (!x.ok) return toast(x.error); await reload('Persona agregada.');
  }));
  $a('[data-rmadm]', (b) => (b.onclick = () => confirmModal({ title: '¿Quitar el acceso?', text: 'Esta persona deja de poder entrar al panel de administración.', ok: 'Quitar', danger: true,
    onOk: async () => { const x = await api.removeAdmin(b.dataset.rmadm); if (!x.ok) return toast(x.error); await reload('Acceso quitado.'); } })));
  $a('[data-pol]', (s) => (s.onchange = async () => { const x = await api.setPolicy(s.dataset.pol, s.value); if (!x.ok) { toast(x.error); await reload(); return; } await reload('Guardado.'); }));
  $a('[data-inv]', (b) => (b.onclick = () => {
    const m = document.createElement('div'); m.style.cssText = 'position:fixed;inset:0;background:#2b1d1699;z-index:90;display:grid;place-items:center;padding:16px';
    m.innerHTML = `<div class="card" style="max-width:440px;width:100%;margin:0"><h2>Invitar a ${esc(b.dataset.invn)}</h2><p class="muted" style="margin:6px 0 12px">Escribí el email con el que el dueño va a crear su cuenta. Solo ese email podrá reclamar el local.</p>
    <div class="field"><label for="ivm">Email del dueño</label><input id="ivm" type="email"><div class="ferr" id="ive" role="alert"></div></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="ivx">Cancelar</button><button class="btn" id="ivk">Crear invitación</button></div></div>`;
    document.body.append(m); mountModal(m); m.querySelector('#ivx').onclick = () => m.remove();
    m.querySelector('#ivk').onclick = async () => {
      const x = await api.invite(b.dataset.inv, m.querySelector('#ivm').value); if (!x.ok) { m.querySelector('#ive').textContent = x.error; return; }
      m.remove(); try { await navigator.clipboard.writeText(siteLink(x.data)); } catch (e) { /* sin portapapeles */ }
      await reload('Invitación creada. Link copiado: mandáselo al dueño.');
    };
  }));

 document.querySelectorAll('[data-chip]').forEach(e=>e.onclick=()=>{e.classList.toggle('on');e.setAttribute('aria-pressed',e.classList.contains('on'))});
 document.querySelectorAll('[data-tg]').forEach(e=>e.onclick=()=>{e.classList.toggle('on');e.setAttribute('aria-checked',e.classList.contains('on'));const k=e.dataset.tg,v=e.classList.contains('on');if(k)emailPrefs[k]=v;if(api.live&&k){api.setEmailPref(k,v).then(ok=>{if(!ok){e.classList.toggle('on');emailPrefs[k]=!v;toast('No se pudo guardar. Probá de nuevo.')}})}});
 document.querySelectorAll('[data-cupo]').forEach(e=>e.onchange=()=>{cupo=e.value===''?NaN:parseInt(e.value,10);render()});
 document.querySelectorAll('[data-ton]').forEach(e=>e.onclick=()=>{sched[+e.dataset.ton].on^=1;render()});
 document.querySelectorAll('[data-radd]').forEach(e=>e.onclick=()=>{const d=sched[+e.dataset.radd];const l=d.r[0][1];d.r.push([l<'17:00'?'17:00':l,'']);d.r[1]=['18:00','22:00'];render()});
 document.querySelectorAll('[data-rdel]').forEach(e=>e.onclick=()=>{const[i,k]=e.dataset.rdel.split(',').map(Number);sched[i].r.splice(k,1);render()});
 document.querySelectorAll('[data-rin]').forEach(e=>e.onchange=()=>{const[i,k,j]=e.dataset.rin.split(',').map(Number);sched[i].r[k][j]=e.value;render()});
 document.querySelectorAll('[data-save]').forEach(e=>e.onclick=async()=>{
  if(mview==='disp'&&!schedOk()){toast('Revisemos las franjas: necesitamos mínimo 4 horas seguidas');return}
  if(mview==='disp'&&!cupoOk()){toast('El cupo mínimo es de 5 cafés por día');return}
  if(mview==='cafe'){
   const root=document.querySelector('.cafegrid');let ok=validateGroup(root);
   const pe=document.getElementById('err-photos'),le=document.getElementById('err-logo'),se=document.getElementById('err-svc');const svcBad=svc.size===0&&!(FD.cf_otros||'').trim();se.textContent=svcBad?'Falta elegir al menos una opción de servicios.':'';if(svcBad)ok=false;
   pe.textContent=photos.length<3?'Necesitamos al menos 3 fotos de tu local (tenés '+photos.length+').':'';le.textContent=logo?'':'Falta el logo de tu cafetería.';
   if(photos.length<3||!logo){if(ok)toast(!logo?'Falta el logo de tu cafetería':'Necesitamos al menos 3 fotos de tu local');ok=false;if(!root.querySelector('.invalid')){document.getElementById('photosCard').scrollIntoView&&document.getElementById('photosCard').scrollIntoView({block:'center'})}}
   if(!ok)return;
   doneCafe=true;
   if(status==='aprobado'){chg.desc=true;chg.fotos=true;if(addrSel&&addrSel.a!==L().addr)chg.addr=true}else if(addrSel){L().addr=addrSel.a;L().barrio=curBarrio()}
  }
  if(mview==='disp')doneDisp=true;
  if(api.live){const ok=await liveSaveDraft();if(!ok){if(mview==='cafe')doneCafe=false;if(mview==='disp')doneDisp=false;return}toast('Guardado.');dirtyKey=null;render();return}
  toast(mview==='cafe'&&status==='aprobado'?'Cambios enviados a revisión (simulado)':'Guardado (simulado)');
  dirtyKey=null;render()});
 document.querySelectorAll('[data-phone-save]').forEach(e=>e.onclick=()=>{const c=e.closest('.card');if(validateGroup(c))toast('Datos guardados (simulado)')});
 document.querySelectorAll('[data-pw-update]').forEach(e=>e.onclick=()=>{if(!validateGroup(document.querySelector('[data-pwcard]')))return;['ac_p1','ac_p2'].forEach(k=>{delete FD[k];delete TOUCH[k]});render();toast('Contraseña actualizada. Te enviamos un aviso por email (simulado)')});
 document.querySelectorAll('[data-logo-file]').forEach(e=>e.onchange=()=>{const f=e.files[0];if(!f)return;if(!/^image\/(png|jpeg)$/.test(f.type)){toast('Ese formato no se puede usar. ¿Probás con PNG o JPG?');return}if(f.size>5*1024*1024){toast('El logo pesa más de 5 MB. Probá comprimirlo.');return}if(api.live){liveUpload(f,'logo');return}let u;try{u=URL.createObjectURL(f)}catch(x){}logo={n:f.name,u};if(u){const im=new Image();im.onload=()=>{if(Math.min(im.naturalWidth,im.naturalHeight)<1000)toast('El logo es chico ('+im.naturalWidth+'×'+im.naturalHeight+'). Lo ideal es al menos 1000×1000 px.')};im.src=u}render()});
 document.querySelectorAll('[data-ph-file]').forEach(e=>e.onchange=()=>{const f=e.files[0];if(!f)return;if(!/^image\/(png|jpeg)$/.test(f.type)){toast('Ese formato no se puede usar. ¿Probás con JPG o PNG?');return}if(f.size>5*1024*1024){toast('La foto pesa más de 5 MB. Probá comprimirla.');return}if(api.live){liveUpload(f,'photo');return}let u;try{u=URL.createObjectURL(f)}catch(x){}photos.push({n:f.name,u});render()});
 document.querySelectorAll('.filebtn,.addph').forEach(e=>e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();e.querySelector('input').click()}}));
 document.querySelectorAll('[data-ph-l]').forEach(e=>e.onclick=()=>{const i=+e.dataset.phL;[photos[i-1],photos[i]]=[photos[i],photos[i-1]];render()});
 document.querySelectorAll('[data-ph-r]').forEach(e=>e.onclick=()=>{const i=+e.dataset.phR;[photos[i+1],photos[i]]=[photos[i],photos[i+1]];render()});
 document.querySelectorAll('[data-ph-d]').forEach(e=>e.onclick=()=>{photos.splice(+e.dataset.phD,1);render()});
 document.querySelectorAll('[data-ph-c]').forEach(e=>e.onclick=()=>cropModal(+e.dataset.phC));
 document.querySelectorAll('[data-map]').forEach(e=>e.onclick=()=>{if(api.live){liveToggleMap();return}if(onMap){pauseModal()}else{onMap=true;pauseInfo=null;cooldownUntil=Date.now()+300000;render();toast('Local activo nuevamente')}});
 document.querySelectorAll('[data-ctr]').forEach(e=>e.onchange=()=>{contractOk=e.checked;render()});
 document.querySelectorAll('[data-dl]').forEach(e=>e.onclick=()=>{if(api.live&&contractRaw)liveContractPdf();else toast('Descargando contrato.pdf (simulado)')});
 document.querySelectorAll('[data-send]').forEach(e=>e.onclick=()=>{if(api.live){liveSend(e);return}status='pendiente';toast('Adhesión enviada. Te enviamos un email de confirmación (simulado)');mview='inicio';render()});
 const on_=$('[data-obn]'),op_=$('[data-obp]');
 if(on_)on_.onclick=async()=>{if(!validateGroup(document.querySelector('[data-step-card]')))return;
  if(api.live){on_.disabled=true;const ok=await liveSaveOnb(ob>=2);on_.disabled=false;if(!ok)return}
  if(ob<2){ob++;render();return}
  if(newBranch){locals.push({addr:addrSel.a,barrio:curBarrio(),code:'63094',snap:{status:'borrador',onMap:true,doneCafe:false,doneDisp:false,pauseInfo:null,cooldownUntil:0,schedPause:null,chg:{desc:false,fotos:false},extra:{items:[],pub:[],review:false},photos:[],logo:null}});newBranch=false;contractOk=true;loadLoc(locals.length-1);view='m-app';mview='inicio';toast('Sucursal agregada');render()}
  else{locals[0].addr=addrSel.a;locals[0].barrio=curBarrio();view='m-nuevo';status='borrador';mview='inicio';render()}};
 if(op_)op_.onclick=()=>{if(ob>0){ob--;render()}};
 document.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>{toast(e.dataset.act+' (simulado)')});
 
}
const toggleTheme=()=>{panelTheme=panelTheme==='dark'?'light':'dark';render()};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href="#"]');if(a)e.preventDefault();if(bellOpen&&!e.target.closest('.notif,[data-bell]')){bellOpen=false;render()}if(helpOpen&&!e.target.closest('.helpbox,[data-help]')){helpOpen=false;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&helpOpen&&!document.querySelector('[data-modal]')){helpOpen=false;render();const hb=document.querySelector('[data-help]');hb&&hb.focus()}if(e.key==='Escape'&&bellOpen&&!document.querySelector('[data-modal]')){bellOpen=false;render();const b=document.querySelector('[data-bell]');b&&b.focus()}});
($('#netbtn')||{}).onclick=()=>{if(!['m-nuevo','m-pend','m-corr','m-ok','m-two','m-app','admin'].includes(view)){view='m-ok';status='aprobado'}netErr=true;render()};
($('#sesbtn')||{}).onclick=()=>{if(['auth','onb','verify','expired','forgot','reset'].includes(view)){view='m-ok';status='aprobado';render()}sessionExpiredModal()};
($('#skipcd')||{}).onclick=()=>{cooldownUntil=0;render();toast('Cooldown reiniciado (solo maqueta)')};
setInterval(()=>{const e=$('[data-cd]');if(!e)return;const l=cooldownLeft();if(l<=0)render();else e.textContent=fmtLeft(l)},1000);
if(api.live){render();api.init(liveAuthEvent).then(liveBoot).catch(()=>toast('No pudimos conectar con el servidor.'))}else render();

/* Fechas en formato dd/mm/aaaa (máscara) */
function dIso(v){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v||'').trim());if(!m)return '';const d=+m[1],mo=+m[2],y=+m[3];const t=new Date(y,mo-1,d);if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return '';return m[3]+'-'+m[2]+'-'+m[1]}
document.addEventListener('input',e=>{const el=e.target;if(!el||!el.matches||!el.matches('[data-date]'))return;let d=el.value.replace(/\D/g,'').slice(0,8);let o=d.slice(0,2);if(d.length>2)o+='/'+d.slice(2,4);if(d.length>4)o+='/'+d.slice(4);el.value=o});
