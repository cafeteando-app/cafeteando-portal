<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafeteando · Portal de comercios</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Red+Hat+Display:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#2B1D16;--accent:#8F513A;--nav-bg:#2B1D16;--nav-link:#ffffffcc;--nav-on-bg:#ffffff14;--nav-on-fg:#E58F6A;--nav-sub:#E3A784;--nav-hover:#ffffff0d;--nav-who:#ffffff0d;--nav-line:#ffffff14;--bad-text:#B3443A;--bg-neutral:#ECE6E0;--fg-neutral:#5A4F48;--bg-warn:#FFF1D6;--fg-warn:#9A6411;--bg-info:#E3EEF9;--fg-info:#2F5F94;--bg-ok:#DDF1E5;--fg-ok:#2F6A4A;--bg-bad:#F8DEDA;--fg-bad:#9C372E;--bg-susp:#EADDD6;--fg-susp:#6b3b28;--bg-note:#FFF8E6;--bg-local:#EFDDCB;--line-local:#E3A784;color-scheme:light;--terracota:#A96649;--terracota-oscuro:#8F513A;--terracota-claro:#E3A784;--crema:#F6EEE4;--crema-clara:#FBF7F1;--blanco:#fff;--espresso:#2B1D16;--muted:#6F5F55;--line:#E6D9CB;--ok:#3E7D5A;--warn:#B7791F;--bad:#B3443A;--info:#3B6EA5;--r:14px;--sh:0 2px 10px rgba(43,29,22,.08)}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--crema);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:'Red Hat Display',sans-serif;font-weight:800;line-height:1.2}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.demo{position:sticky;top:0;z-index:50;background:var(--espresso);color:#fff;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.demo b{color:var(--terracota-claro)}
.demo button{background:#ffffff1a;color:#fff;border:1px solid #ffffff40;border-radius:99px;padding:4px 12px;font-size:12px}
.demo button.on{background:var(--terracota);border-color:var(--terracota)}
.demo .sp{flex:1}
.btn{background:var(--terracota);color:#fff;border:0;border-radius:99px;padding:10px 20px;font-weight:600}
.btn:hover{background:var(--terracota-oscuro)}
.btn.sec{background:transparent;color:var(--accent);border:1.5px solid var(--terracota)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.card{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}
.b-borrador{background:var(--bg-neutral);color:var(--fg-neutral)}.b-pendiente{background:var(--bg-warn);color:var(--fg-warn)}.b-correccion{background:var(--bg-info);color:var(--fg-info)}.b-aprobado{background:var(--bg-ok);color:var(--fg-ok)}.b-rechazado{background:var(--bg-bad);color:var(--fg-bad)}.b-suspendido{background:var(--bg-susp);color:var(--fg-susp)}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--crema-clara);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--terracota-claro);border-color:var(--terracota)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--crema-clara);border-radius:99px;padding:6px 14px;font-size:13px}
.chip.on{background:var(--terracota);color:#fff;border-color:var(--terracota)}
/* auth */
.auth{min-height:calc(100vh - 40px);display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:var(--terracota);color:#fff;padding:60px 48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.auth .side h1{font-size:34px}.auth .side li{margin:8px 0 8px 18px}
.auth .form{display:flex;align-items:center;justify-content:center;padding:32px}
.auth .box{width:100%;max-width:400px}
.tabs{display:flex;gap:4px;background:var(--crema);border-radius:99px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;border-radius:99px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--blanco);color:var(--ink);box-shadow:var(--sh)}
@media(max-width:800px){.auth{grid-template-columns:1fr}.auth .side{padding:28px}}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 40px)}
.nav{background:var(--nav-bg);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.nav .logo{font-family:'Red Hat Display';font-weight:800;font-size:19px;padding:0 10px 4px}
.nav .sub{font-size:11px;color:var(--terracota-claro);padding:0 10px 16px;letter-spacing:.08em;text-transform:uppercase}
.nav a{color:#ffffffcc;text-decoration:none;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.nav a.on{background:var(--terracota);color:#fff}
.nav a:hover:not(.on){background:#ffffff14}
.nav .fill{flex:1}
.localbox{background:var(--bg-local);border:1.5px solid var(--line-local);border-radius:18px;padding:16px;margin-bottom:22px}
.lb-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.statusrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px dashed var(--terracota-claro);font-size:13px}
.statusrow>span:first-child{color:var(--muted);font-weight:600}.lb-code{margin-left:auto;color:var(--muted)}.lb-code b{color:var(--ink)}
.localbox .tabsbar{margin-bottom:6px}
.tabsbar{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
.ltab{display:flex;gap:10px;align-items:center;background:var(--blanco);border:2px solid var(--line);border-radius:14px;padding:8px 16px;text-align:left;white-space:nowrap;color:var(--ink)}
.ltab span{display:flex;flex-direction:column;line-height:1.2}.ltab small{color:var(--muted);font-size:11px}
.ltab.on{border-color:var(--terracota);background:var(--crema-clara);box-shadow:var(--sh)}
.ltab.add{border-style:dashed;color:var(--accent);font-weight:600;background:transparent}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--warn)}.d-ok{background:var(--ok)}.d-correccion{background:var(--info)}.d-off{background:#9a8f88}.d-rechazado{background:var(--bad)}
.swbar{display:flex;gap:10px;align-items:center;background:var(--blanco);border-radius:99px;padding:6px 8px 6px 16px;margin-bottom:16px;box-shadow:var(--sh);width:fit-content;max-width:100%}.swbar span{font-size:12px;color:var(--muted);font-weight:600}.swbar select{width:auto;border-radius:99px;padding:6px 12px}
.locrow{border:2px solid var(--line);border-radius:12px;padding:12px}
.locrow.here{border-color:var(--terracota);background:var(--crema-clara)}
.here-tag{background:var(--terracota);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.info{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--terracota);background:var(--blanco);color:var(--accent);font-weight:700;font-family:serif;font-style:italic;line-height:1}
.info[aria-expanded=true]{background:var(--terracota);color:#fff}
.infobox{margin-top:10px;padding:12px 14px;background:var(--blanco);border-radius:10px;border-left:4px solid var(--terracota)}.infobox p{margin:4px 0 10px;color:var(--muted)}
.who{background:#ffffff12;border-radius:12px;padding:12px;margin:40px 0 0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:#ffffffb3;word-break:break-all}.who b{color:#fff;font-size:14px}.who a{color:var(--terracota-claro);cursor:pointer;margin-top:6px;font-weight:600}
.nav .user{font-size:12px;color:#ffffff99;padding:10px}
.main{padding:28px;max-width:1440px;width:100%;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
@media(max-width:800px){.shell{grid-template-columns:1fr}.nav{flex-direction:row;overflow:auto;padding:10px}.nav .logo,.nav .sub,.nav .fill,.nav .user,.nav .who{display:none}.nav a{white-space:nowrap}.main{padding:16px}}
.banner{border-radius:var(--r);padding:16px 20px;margin-bottom:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.pend{background:var(--bg-warn)}.banner.corr{background:var(--bg-info)}.banner.ok{background:var(--bg-ok)}
.steps{display:flex;gap:0;margin:8px 0 6px}
.step{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:30px}
.step:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--muted);font-weight:600;display:grid;place-items:center}
.step:after{content:"";position:absolute;top:11px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:var(--line)}
.step:last-child:after{display:none}
.step.done:before{background:var(--ok);color:#fff;content:"✓"}.step.done:after{background:var(--ok)}
.step.cur:before{background:var(--terracota);color:#fff}.step.cur{color:var(--ink);font-weight:600}
.kpi{font-family:'Red Hat Display';font-size:30px;font-weight:800;color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click:hover{background:var(--crema-clara);cursor:pointer}
.drop{border:2px dashed var(--terracota-claro);border-radius:var(--r);padding:22px;text-align:center;background:var(--crema-clara);color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ph{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#d9b99f,#a96649);display:grid;place-items:center;color:#fff;font-size:11px;position:relative}
.ph.empty{background:var(--crema-clara);border:2px dashed var(--line);color:var(--muted)}
.ph.logo{background:var(--espresso);font-size:26px}
.log li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log{padding:0}
.week{display:grid;grid-template-columns:100px 60px 1fr 1fr 90px;gap:8px;align-items:center;margin-bottom:8px}
.week input[type=time]{padding:6px 8px}
@media(max-width:800px){.week{grid-template-columns:80px 50px 1fr 1fr}.week .cu{display:none}}
.week2{display:grid;grid-template-columns:100px 56px 1fr 40px;gap:10px;align-items:start;margin-bottom:12px}
.week2>b{padding-top:8px}.week2 .toggle{margin-top:6px}
.rngs{display:flex;flex-direction:column;gap:8px}
.rng{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rng input,.rng select{width:112px;padding:6px 8px}
.rng .x{border:0;background:transparent;font-size:20px;color:var(--muted);line-height:1}
.err{color:var(--bad-text);font-weight:600}
.plus{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--terracota);background:var(--blanco);color:var(--accent);font-size:20px;line-height:1}
.plus:hover{background:var(--terracota);color:#fff}
@media(max-width:800px){.week2{grid-template-columns:80px 50px 1fr}.week2 .plus{grid-column:3;justify-self:start}}
.toggle{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;border:0}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:var(--ok)}.toggle.on:after{left:21px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#fff;padding:12px 22px;border-radius:99px;z-index:99;box-shadow:var(--sh)}
.note{background:var(--bg-note);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.phone{background:var(--espresso);border-radius:26px;padding:10px;width:240px}
.phone .scr{background:var(--crema);border-radius:18px;padding:14px;min-height:260px}
.pc{background:var(--blanco);border-radius:12px;padding:10px;margin-top:8px;font-size:12px}

[data-theme=dark]{--crema:#2B1E18;--crema-clara:#3D2C23;--blanco:#36271F;--line:#554235;--muted:#BFAEA2;--ink:#F6ECE1;--accent:#E8A07C;--nav-bg:#140D0A;--nav-link:#ffffffcc;--nav-on-bg:#ffffff14;--nav-on-fg:#E58F6A;--nav-sub:#E3A784;--nav-hover:#ffffff0d;--nav-who:#ffffff0d;--nav-line:#ffffff14;--bad-text:#F08A7E;--sh:0 2px 12px rgba(0,0,0,.45);--bg-neutral:#3A312C;--fg-neutral:#CFC3B9;--bg-warn:#4A3A17;--fg-warn:#F2C46B;--bg-info:#1F3550;--fg-info:#8DB8E8;--bg-ok:#1F4030;--fg-ok:#7FD1A0;--bg-bad:#4D2420;--fg-bad:#F19A91;--bg-susp:#4A3329;--fg-susp:#D9B39C;--bg-note:#3A2F18;--bg-local:#3F2D23;--line-local:#6A4C39;color-scheme:dark}
[data-theme=dark] .ph.empty,[data-theme=dark] .drop{background:var(--crema-clara)}
/* --- pulido general --- */
body{-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
h1{font-size:28px;letter-spacing:-.01em}h2{letter-spacing:-.005em}
.card{border:1px solid var(--line);box-shadow:0 1px 2px rgba(43,29,22,.04),0 6px 18px rgba(43,29,22,.05);padding:24px;transition:background .2s,border-color .2s}
[data-theme=dark] .card{box-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn{box-shadow:0 1px 2px rgba(43,29,22,.2);transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(169,102,73,.3)}
.btn:active{transform:none}
.btn.sec{box-shadow:none}.btn.sec:hover{background:var(--terracota);color:#fff}
.btn[disabled]{cursor:not-allowed}
input,select,textarea{transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--terracota);box-shadow:0 0 0 3px rgba(169,102,73,.25)}
.nav{position:relative}
.themeico{position:absolute;top:22px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff30;background:#ffffff12;color:#F3E9DE;display:grid;place-items:center;transition:background .15s}
.themeico:hover{background:#ffffff26}
@media(max-width:800px){.themeico{position:static;order:99;margin-left:auto;flex:none}}
.nav{background:linear-gradient(180deg,var(--nav-bg),var(--nav-bg));border-right:1px solid #ffffff10;padding:26px 14px}
.nav .logo{font-size:21px;letter-spacing:-.01em}
.nav a{font-weight:500;font-size:14px;padding:11px 14px;border-radius:10px;position:relative;transition:background .15s,color .15s}
.nav a.on{background:#ffffff14;color:#E58F6A;font-weight:600}
.nav a.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--terracota-claro)}
.nav a:hover:not(.on){background:#ffffff0d;color:#fff}
.who{background:#ffffff0d;border:1px solid #ffffff14}
.who a{display:block}
.main{padding:32px 36px}
.top{margin-bottom:24px}
.grid.g3.kpis{margin-bottom:32px}
.grid.g3>.card{border-top:3px solid var(--terracota-claro);margin:0}
.kpi{font-size:36px;letter-spacing:-.02em}
.banner{border:1px solid var(--line)}
.localbox{box-shadow:var(--sh)}
.ltab{transition:border-color .15s,box-shadow .15s}.ltab:hover:not(.on){border-color:var(--terracota-claro)}
.auth .side{background:linear-gradient(155deg,var(--terracota),#7d4530)}
.badge{letter-spacing:.01em}
th{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
::selection{background:var(--terracota);color:#fff}
@media(max-width:800px){.main{padding:18px 16px}.nav a.on:before{display:none}}
.nav{border-right:0}
.nav .sub{color:var(--nav-sub)}
.nav a{color:var(--nav-link)}
.nav a.on{background:var(--nav-on-bg);color:var(--nav-on-fg)}
.nav a.on:before{background:var(--nav-on-fg)}
.nav a:hover:not(.on){background:var(--nav-hover);color:#fff}
.who{background:var(--nav-who);border:1px solid var(--nav-line);color:var(--nav-link)}
.who a{color:#fff}
.themeico{border-color:var(--nav-line);background:var(--nav-who);color:#fff}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--terracota-claro),var(--terracota))}
.chart{display:flex;gap:10px;align-items:flex-end;height:170px;margin-top:14px}

.chart .v{font-size:11px;color:var(--muted)}.chart small{font-size:11px;color:var(--muted)}
.cafegrid{grid-template-columns:1fr 260px;align-items:start}
.log li .badge{margin-right:8px}
/* ---- adaptativo: tablet ---- */

}

.tabs{background:var(--blanco);border:1.5px solid var(--terracota-claro);padding:4px}

.who{padding:14px;gap:0;align-self:stretch;width:100%;word-break:normal;overflow:hidden}
.who-head{display:flex;gap:10px;align-items:center;min-width:0}
.who .av{width:36px;height:36px;border-radius:50%;background:var(--terracota);color:#fff;display:grid;place-items:center;font-weight:800;font-family:'Red Hat Display';flex:none}
.who .wi{display:flex;flex-direction:column;min-width:0;flex:1}

const LEGAL={"terminos": {"t": "Términos y condiciones del portal de comercios", "h": "<h2>1. Aceptación y alcance<\/h2>\n<p>Al registrarte en el portal de comercios de <strong>CAFETEANDO<\/strong> declarás haber leído y aceptado estos Términos y Condiciones y la Política de Privacidad.<\/p>\n<p>Estos términos regulan el uso del portal y el proceso de adhesión de tu local a la red. Las condiciones comerciales del servicio (qué ofrecés, cupo diario, canjes, baja) están en las <em>Condiciones del servicio para locales<\/em>, que firmás una vez que aprobamos tu local.<\/p>\n<h2>2. Cómo funciona Cafeteando<\/h2>\n<p>CAFETEANDO es un sistema de membresía mensual: los socios acceden a un café de especialidad por día en los locales adheridos a la red. Cafeteando administra la membresía y la relación con los socios.<\/p>\n<p>Tu local decide qué café ofrece y en qué horarios. Una vez activo, aparece en la app y los socios canjean su café en tu local con el código que te asignamos.<\/p>\n<h2>3. Quién puede registrarse<\/h2>\n<p>Para crear una cuenta en el portal tenés que:<\/p>\n<ul><li>ser mayor de 18 años;<\/li><li>ser titular, representante o estar autorizado/a para actuar en nombre del local;<\/li><li>usar un correo electrónico válido y propio. El email de tu cuenta de comercio no puede ser el mismo que usás como socio en la app;<\/li><li>brindar información veraz y mantenerla actualizada.<\/li><\/ul>\n<p>Sos responsable de la confidencialidad de tu contraseña y de lo que se haga desde tu cuenta. Si sospechás un uso no autorizado, avisanos.<\/p>\n<h2>4. Cómo es la adhesión<\/h2>\n<ul><li><strong>Registro:<\/strong> creás tu cuenta y verificás tu correo.<\/li><li><strong>Solicitud:<\/strong> completás los datos del local (datos básicos, logo, fotos, horarios y cupo) y la enviás a revisión.<\/li><li><strong>Revisión:<\/strong> el equipo de Cafeteando la revisa. Puede aprobarla, pedirte correcciones o rechazarla.<\/li><li><strong>Firma:<\/strong> si se aprueba, firmás las condiciones del servicio desde el portal, con tu nombre y rol.<\/li><li><strong>Activación:<\/strong> con la firma tu local queda activo y ves tu código de canje.<\/li><\/ul>\n<p>Enviar la solicitud no garantiza la aprobación. Cafeteando puede rechazar una solicitud cuando el local no cumpla los requisitos de la red o la información no sea suficiente.<\/p>\n<h2>5. Información y contenido que cargás<\/h2>\n<p>Los datos, textos, logo y fotos que cargues tienen que ser verdaderos, actuales y no infringir derechos de terceros. Declarás que tenés derecho a usarlos.<\/p>\n<p>Nos autorizás a mostrarlos en la app, en el sitio y en las comunicaciones del programa mientras tu local esté adherido, con el único fin de dar a conocer tu local a los socios.<\/p>\n<p>Sos responsable de mantener al día tus horarios y tu cupo diario. Algunos cambios sobre un local ya aprobado se aplican directamente y otros requieren revisión de Cafeteando antes de publicarse.<\/p>\n<h2>6. Uso del portal<\/h2>\n<p>Te comprometés a usar el portal solo para administrar tu local y de forma lícita. No está permitido:<\/p>\n<ul><li>acceder o intentar acceder a datos o cuentas de otros comercios;<\/li><li>interferir con el funcionamiento del portal o de la app;<\/li><li>compartir tu código de canje con quienes no deban conocerlo ni usarlo para canjes que no correspondan;<\/li><li>cargar información falsa o engañosa.<\/li><\/ul>\n<h2>7. Activación, pausa y suspensión<\/h2>\n<p>Con tu local activo podés pausarlo y reactivarlo desde el portal, dentro de los límites que el portal indique.<\/p>\n<p>Cafeteando puede suspender o dar de baja un local o una cuenta ante incumplimientos de estos términos o de las condiciones del servicio, información falsa, uso indebido del código de canje o cualquier conducta que afecte el funcionamiento del servicio. Podés darte de baja en los términos que establecen las condiciones del servicio.<\/p>\n<h2>8. Responsabilidad<\/h2>\n<p>CAFETEANDO actúa como plataforma que conecta a los socios con los locales adheridos. Cada local es responsable de los productos que ofrece, su preparación, calidad e higiene, la atención al público y las habilitaciones y obligaciones propias de su actividad.<\/p>\n<p>Cafeteando procura que el portal funcione de forma continua, pero no garantiza que esté disponible sin interrupciones. No será responsable por fallas originadas en proveedores tecnológicos o servicios de terceros, como servicios de internet, hosting o envío de correos.<\/p>\n<p>Ninguna disposición de estos términos excluye o limita derechos o responsabilidades que no puedan ser legalmente excluidos o limitados.<\/p>\n<h2>9. Propiedad intelectual<\/h2>\n<p>El nombre CAFETEANDO, su identidad visual, el software del portal y de la app y sus contenidos pertenecen a CAFETEANDO o se usan bajo licencia, y no pueden usarse sin autorización fuera de los fines del programa. Tu local conserva la propiedad de su nombre, marca, logo y fotos.<\/p>\n<h2>10. Modificaciones<\/h2>\n<p>Podemos actualizar estos términos y el funcionamiento del portal cuando sea necesario. Si el cambio es sustancial, te lo vamos a comunicar por correo o dentro del portal con una antelación razonable.<\/p>\n<h2>11. Ley aplicable y jurisdicción<\/h2>\n<p>Estos términos se rigen por las leyes de la República Argentina. Ante controversias, serán competentes los tribunales que correspondan conforme a la normativa aplicable.<\/p>\n<h2>12. Contacto<\/h2>\n<p>Para consultas sobre estos términos: <strong><a href=\"mailto:contactocafeteando@gmail.com\">contactocafeteando@gmail.com<\/a><\/strong><\/p>\n<p><strong>CAFETEANDO — Ciudad Autónoma de Buenos Aires, República Argentina.<\/strong><\/p>"}, "privacidad": {"t": "Política de privacidad para comercios", "h": "<h2>1. Responsable del tratamiento de datos<\/h2>\n<p>CAFETEANDO es una marca registrada y opera bajo ese nombre, con domicilio en Ciudad Autónoma de Buenos Aires, República Argentina. Es responsable del tratamiento de los datos personales que recolectamos a través del portal de comercios.<\/p>\n<p>Si CAFETEANDO fuera transferido, aportado o desarrollado por una sociedad constituida a tal efecto, actualizaremos esta Política para reflejarlo.<\/p>\n<h2>2. Qué datos recolectamos<\/h2>\n<p>Cuando te registrás y adherís tu local, podemos tratar:<\/p>\n<ul><li><strong>Tus datos de contacto:<\/strong> nombre y apellido, rol en el local, correo electrónico y teléfono o WhatsApp;<\/li><li><strong>Datos del local:<\/strong> nombre, dirección y ubicación en el mapa, link de Google Maps, redes sociales, descripción, horarios, cupo diario, servicios y beneficios, logo y fotos;<\/li><li><strong>Registros de tu actividad en el portal:<\/strong> solicitudes, correcciones, aprobaciones, cambios sobre tu local y la firma de las condiciones del servicio (fecha, hora, versión, nombre, rol y cuenta desde la que se firmó);<\/li><li><strong>Estadísticas de canjes en tu local:<\/strong> cantidad y horario, sin datos personales de los socios;<\/li><li><strong>Datos técnicos<\/strong> necesarios para el funcionamiento y la seguridad del portal, como la sesión iniciada.<\/li><\/ul>\n<p>Solo recolectamos los datos adecuados y necesarios para las finalidades informadas. Los datos de contacto y del local son necesarios para gestionar tu adhesión; sin ellos no podemos darte de alta.<\/p>\n<h2>3. Para qué usamos tus datos<\/h2>\n<ul><li>evaluar y gestionar la adhesión de tu local;<\/li><li>crear y administrar tu cuenta y tu panel;<\/li><li>mostrar tu local a los socios en la app y el sitio (nombre, dirección, horarios, fotos, descripción y servicios);<\/li><li>enviarte comunicaciones del servicio: solicitud recibida, correcciones, aprobación, firma, activación y recordatorios;<\/li><li>conservar la constancia de las condiciones que aceptaste y de los cambios realizados;<\/li><li>prevenir usos indebidos y fraudes, y garantizar la seguridad del portal;<\/li><li>generar estadísticas agregadas o anonimizadas y mejorar el servicio;<\/li><li>cumplir obligaciones legales o requerimientos de autoridades.<\/li><\/ul>\n<p>Los datos del local que cargás para la app son visibles para los socios. Tus datos personales de contacto (nombre, correo, teléfono) no se publican.<\/p>\n<h2>4. Con quién compartimos tus datos<\/h2>\n<p>CAFETEANDO no vende tus datos personales.<\/p>\n<p>Podemos compartir información con proveedores cuando resulte necesario para prestar el servicio: Supabase y otros proveedores de infraestructura y hosting, para almacenar y procesar la información; Brevo, para enviar los correos del servicio; y servicios de búsqueda de direcciones y mapas, para ubicar tu local.<\/p>\n<p>También podemos usar y compartir información agregada o anonimizada con fines estadísticos o de análisis del programa, sin identificarte.<\/p>\n<h2>5. Almacenamiento y seguridad<\/h2>\n<p>Los datos se almacenan y procesan mediante servicios de infraestructura tecnológica, incluyendo Supabase. Aplicamos medidas técnicas y organizativas razonables para protegerlos contra accesos no autorizados, pérdida, alteración o uso indebido. Cada comercio solo puede ver la información de su propio local.<\/p>\n<p>Cuando algún proveedor almacene o procese información fuera de la República Argentina, procuraremos adoptar las medidas que correspondan según la normativa aplicable.<\/p>\n<h2>6. Tus derechos<\/h2>\n<p>De acuerdo con la normativa argentina de protección de datos personales, tenés derecho a solicitar información sobre tus datos, y su acceso, actualización, rectificación o supresión cuando corresponda, y a oponerte a determinados tratamientos.<\/p>\n<p>Para ejercer tus derechos, o pedir la eliminación de tus datos, escribinos a <strong><a href=\"mailto:contactocafeteando@gmail.com\">contactocafeteando@gmail.com<\/a><\/strong>. Responderemos dentro de los plazos legales.<\/p>\n<p>La Agencia de Acceso a la Información Pública (AAIP) es el organismo de control en materia de protección de datos personales en Argentina. Si considerás que tus derechos no fueron atendidos, podés recurrir ante ese organismo.<\/p>\n<h2>7. Conservación de los datos<\/h2>\n<p>Conservamos tus datos mientras tu local esté adherido y mientras sea necesario para las finalidades informadas y para cumplir obligaciones legales. Cuando dejen de ser necesarios, los eliminamos, anonimizamos o conservamos solo si existe una obligación legal que lo justifique.<\/p>\n<p>La constancia de las condiciones que aceptaste y de los cambios realizados puede conservarse durante el plazo necesario para acreditar esas operaciones.<\/p>\n<h2>8. Cookies y tecnologías similares<\/h2>\n<p>El portal usa identificadores de sesión y almacenamiento local necesarios para mantener tu sesión iniciada y recordar preferencias como el tema claro u oscuro. No usamos cookies de terceros con fines de publicidad personalizada.<\/p>\n<h2>9. Cambios en esta Política de Privacidad<\/h2>\n<p>Podemos actualizar esta Política cuando cambie el servicio, los proveedores o la normativa. Si el cambio es sustancial, te lo vamos a comunicar por correo o dentro del portal y, cuando corresponda, pediremos de nuevo tu consentimiento. La versión vigente está disponible en el portal.<\/p>\n<h2>10. Contacto<\/h2>\n<p>Para consultas sobre esta Política, el tratamiento de tus datos o el ejercicio de tus derechos:<\/p>\n<p><strong><a href=\"mailto:contactocafeteando@gmail.com\">contactocafeteando@gmail.com<\/a><\/strong><\/p>\n<p><strong>CAFETEANDO — Ciudad Autónoma de Buenos Aires, República Argentina.<\/strong><\/p>"}};

</script>
<script>
/* Capa de datos del portal.
   - mode 'mock': no hace nada (la maqueta usa datos de ejemplo en memoria).
   - mode 'supabase': conecta la AUTENTICACIÓN real (registro, ingreso, recuperación) con Supabase Auth.
   Etapa 1: solo acceso. Los datos del panel siguen siendo de ejemplo hasta conectar la etapa 2. */
const PCFG = window.PORTAL_CONFIG || { mode: 'mock' };

const api = (() => {
  const live = PCFG.mode === 'supabase';
  let client = null;
  let lastSession = null;

  // URL a la que vuelven los links de los mails (tiene que estar en la lista de redirecciones permitidas de Supabase).
  const siteUrl = () => PCFG.siteUrl || (location.origin !== 'null' ? location.origin + location.pathname : '');

  const MSG_SOCIO = 'Esta cuenta es de la app de Cafeteando (socio). Para tu comercio creá una cuenta nueva con otro email.';

  const errMsg = (e) => {
    const c = (e && (e.code || e.error_code)) || '';
    const m = ((e && e.message) || '').toLowerCase();
    if (c === 'invalid_credentials' || m.includes('invalid login')) return 'Email o contraseña incorrectos.';
    if (c === 'email_not_confirmed' || m.includes('not confirmed')) return 'EMAIL_NOT_CONFIRMED';
    if (c === 'over_request_rate_limit' || c === 'over_email_send_rate_limit' || (e && e.status === 429))
      return 'Hiciste muchos intentos. Podés esperar unos minutos y probar de nuevo.';
    if (c === 'weak_password' || m.includes('pwned') || m.includes('compromised') || (m.includes('password') && m.includes('weak')))
      return 'Esa contraseña es muy débil o apareció en filtraciones. ¿Probás con otra?';
    if (c === 'same_password' || m.includes('different from the old')) return 'La contraseña nueva tiene que ser distinta a la anterior.';
    if (m.includes('fetch') || m.includes('network')) return 'No pudimos conectar. ¿Revisás tu conexión y probamos de nuevo?';
    return 'No pudimos completar la acción. ¿Probamos de nuevo en un momento?';
  };

  const loadLib = () => new Promise((res, rej) => {
    if (window.supabase && window.supabase.createClient) return res();
    const s = document.createElement('script');
    s.src = PCFG.supabaseLibUrl || 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = res;
    s.onerror = () => rej(new Error('network'));
    document.head.append(s);
  });

  const isMerchant = (u) => !!u && !!u.user_metadata && u.user_metadata.account_type === 'merchant';

  return {
    live,
    _client: () => client,
    isMerchant,
    errMsg,
    MSG_SOCIO,

    async init(onEvent) {
      if (!live) return null;
      await loadLib();
      client = window.supabase.createClient(PCFG.supabaseUrl, PCFG.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });
      client.auth.onAuthStateChange((ev, sess) => {
        lastSession = sess || null;
        onEvent && onEvent(ev, sess);
      });
      const { data } = await client.auth.getSession();
      lastSession = (data && data.session) || null;
      return lastSession;
    },

    session: () => lastSession,
    user: () => (lastSession && lastSession.user) || null,

    async signUp({ email, password, businessName }) {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: siteUrl(),
          data: { account_type: 'merchant', business_name: businessName },
        },
      });
      if (error) {
        // Si el email ya existe, no lo revelamos: se muestra igual "revisá tu correo".
        if (error.code === 'user_already_exists' || /already/i.test(error.message || '')) return { ok: true, needsVerify: true };
        return { ok: false, error: errMsg(error) };
      }
      return { ok: true, needsVerify: !(data && data.session) };
    },

    async signIn(email, password) {
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        const m = errMsg(error);
        if (m === 'EMAIL_NOT_CONFIRMED') return { ok: false, notConfirmed: true };
        return { ok: false, error: m };
      }
      if (!isMerchant(data.user) && !(await this.isAdmin())) {
        await client.auth.signOut();
        return { ok: false, error: MSG_SOCIO };
      }
      return { ok: true };
    },

    async signOut() { try { await client.auth.signOut(); } catch (e) { /* sin conexión: igual se limpia la sesión local */ } lastSession = null; },

    async resetRequest(email) {
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: siteUrl() });
      // No revelamos si el email existe: solo informamos errores de límite o de red.
      if (error && (error.status === 429 || /fetch|network|rate/i.test(error.message || ''))) return { ok: false, error: errMsg(error) };
      return { ok: true };
    },

    async updatePassword(password) {
      const { error } = await client.auth.updateUser({ password });
      if (error) return { ok: false, error: errMsg(error) };
      try { await client.rpc('notify_password_changed'); } catch (e) { /* aviso best-effort */ }
      return { ok: true };
    },

    async saveOnboarding(merchant, payload, newBranch, reqId) {
      const args = { p_merchant: merchant, p_payload: payload, p_new_branch: !!newBranch };
      if (reqId) args.p_request = reqId;
      const { data, error } = await client.rpc('save_onboarding', args);
      return error ? { ok: false, error: errMsg(error) } : { ok: true, id: data };
    },

    async listRequests() {
      try {
        const { data, error } = await client.from('cafe_requests')
          .select('id,merchant_id,status,kind,cafe_id,payload,review_note,reviewed_by_name,reviewed_at,reviewed_payload,submitted_at,created_at,merchants(contact_name,role,phone,contact_email,created_at)')
          .neq('status', 'draft').order('submitted_at', { ascending: false });
        return error ? { ok: false, error: errMsg(error) } : { ok: true, rows: data || [] };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async decideRequest(id, decision, note) {
      try {
        const { error } = await client.rpc('admin_decide_request', { p_request_id: id, p_decision: decision, p_note: note });
        return error ? { ok: false, error: /NOT_PENDING/.test(error.message) ? 'Esa solicitud ya no está pendiente.' : errMsg(error) } : { ok: true };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async loadMine(reqId) {
      try {
        const m = await client.from('merchants').select('*').maybeSingle();
        if (m.error) return { ok: false, error: errMsg(m.error) };
        if (!m.data) return { ok: true, merchant: null, request: null, requests: [] };
        const q = await client.from('cafe_requests').select('*').eq('merchant_id', m.data.id)
          .eq('kind', 'new_local').order('created_at', { ascending: true });
        const rows = q.data || [];
        const want = reqId || (function () { try { return localStorage.getItem('pc_cur_req'); } catch (e) { return null; } })();
        const pick = rows.find((x) => x.id === want) || rows[0] || null;
        return { ok: true, merchant: m.data, request: pick, requests: rows };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async uploadMedia(file, merchantId) {
      try {
        const ext = ({ 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' })[file.type] || 'jpg';
        const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
        const path = merchantId + '/' + id + '.' + ext;
        const up = await client.storage.from('cafe-media').upload(path, file, { contentType: file.type, upsert: false });
        if (up.error) return { ok: false, error: 'No pudimos subir la imagen. Probá de nuevo.' };
        const { data } = client.storage.from('cafe-media').getPublicUrl(path);
        return { ok: true, url: data.publicUrl };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async submitRequest(id) {
      try {
        const { error } = await client.rpc('submit_request', { p_request_id: id });
        if (!error) return { ok: true };
        const m = error.message || '';
        if (/INCOMPLETE/.test(m)) return { ok: false, incomplete: m.split('INCOMPLETE:')[1].trim().split(',') };
        return { ok: false, error: errMsg(error) };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async approveRequest(id, lat, lng) {
      try {
        const { data, error } = await client.rpc('admin_approve_request', { p_request_id: id, p_lat: lat, p_lng: lng });
        if (!error) return { ok: true, code: data };
        const m = error.message || '';
        if (/COORDS_REQUIRED/.test(m)) return { ok: false, error: 'Faltan las coordenadas del local.' };
        if (/NOT_PENDING/.test(m)) return { ok: false, error: 'Esa solicitud ya no está pendiente.' };
        return { ok: false, error: errMsg(error) };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async setCafeActive(id, active) {
      try {
        const { error } = await client.rpc('admin_set_cafe_active', { p_request_id: id, p_active: !!active });
        return error ? { ok: false, error: /NOT_APPROVED/.test(error.message || '') ? 'Ese local todavía no está aprobado.' : errMsg(error) } : { ok: true };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async myCafeInfo(reqId) {
      try { const { data, error } = await client.rpc('my_cafe_info', reqId ? { p_request: reqId } : {}); return error ? {} : (data || {}); } catch (e) { return {}; }
    },

    async savePhone(phone) {
      try {
        const { data, error } = await client.from('merchants').update({ phone: String(phone || '').trim() }).not('id', 'is', null).select('id');
        if (error) return { ok: false, error: errMsg(error) };
        return (data && data.length) ? { ok: true } : { ok: false, error: 'No pudimos guardar el teléfono.' };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async getEmailPrefs() {
      try { const { data } = await client.from('merchants').select('email_prefs').maybeSingle(); return (data && data.email_prefs) || {}; } catch (e) { return {}; }
    },

    async setEmailPref(key, value) {
      try { const { error } = await client.rpc('set_email_pref', { p_key: key, p_value: !!value }); return !error; } catch (e) { return false; }
    },

    async myStats(reqId) {
      try { const { data, error } = await client.rpc('my_cafe_stats', reqId ? { p_request: reqId } : {}); return error ? {} : (data || {}); } catch (e) { return {}; }
    },

    async listAcceptances() {
      try { const { data, error } = await client.from('portal_contract_acceptances').select('merchant_id,version,accepted_at,signer_name,signer_role').order('accepted_at', { ascending: false }); return error ? [] : (data || []); } catch (e) { return []; }
    },

    async isAdmin() {
      try { const { data, error } = await client.rpc('is_admin'); return !error && data === true; } catch (e) { return false; }
    },

    async resend(email) {
      const { error } = await client.auth.resend({ type: 'signup', email, options: { emailRedirectTo: siteUrl() } });
      return error ? { ok: false, error: errMsg(error) } : { ok: true };
    },
  };
})();

/* ---------- Flujos de autenticación reales (solo se usan en modo 'supabase') ---------- */
function authError(msg) {
  const f = document.querySelector('[data-authform]');
  if (!f) { toast(msg); return; }
  let b = f.querySelector('#err-auth');
  if (!b) {
    b = document.createElement('div');
    b.id = 'err-auth'; b.className = 'ferr'; b.setAttribute('role', 'alert');
    b.style.cssText = 'margin:10px 0';
    const btn = f.querySelector('button[type=submit]');
    (btn ? btn.parentNode : f).insertBefore(b, btn || null);
  }
  b.textContent = msg || '';
}
function authBusy(btn, on) { if (btn) { btn.disabled = on; btn.style.opacity = on ? '.6' : ''; } }

async function liveLogin(btn) {
  authError('');
  authBusy(btn, true);
  try {
    const r = await api.signIn((FD.l_mail || '').trim(), FD.l_pass || '');

// ---- Recuperación de contraseña: nunca debe terminar en un ingreso automático ----
// El link del mail trae una sesión temporal. supabase-js la procesa y borra el hash de la URL antes de
// que arranque el portal, así que la detección tiene que hacerse acá, apenas carga el script.
try { if (/type=recovery/.test((location.hash || '') + '&' + (location.search || ''))) sessionStorage.setItem('pc_recovery', '1'); } catch (e) { /* sin sessionStorage */ }
function recoveryFlag() { try { return sessionStorage.getItem('pc_recovery') === '1'; } catch (e) { return false; } }
function clearRecovery() { try { sessionStorage.removeItem('pc_recovery'); } catch (e) { /* ok */ } }
function isRecoverySession(sess) {
  try {
    const t = sess && sess.access_token; if (!t) return false;
    const pl = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return (pl.amr || []).some((a) => a && a.method === 'recovery');
  } catch (e) { return false; }
}

// Eventos de Supabase Auth (link de verificación, link de recuperación, cierre de sesión).
function liveAuthEvent(ev, sess) {
  if (ev === 'PASSWORD_RECOVERY') { try { sessionStorage.setItem('pc_recovery', '1'); } catch (e) { /* ok */ } delete FD.r_p1; delete FD.r_p2; view = 'reset'; render(); return; }
  if (ev === 'SIGNED_IN' && sess && api.isMerchant(sess.user) && ['auth', 'verify', 'expired'].includes(view) && /type=signup|type=email/.test(location.hash + location.search)) {
    liveAfterLogin(true);
  }
  if (ev === 'SIGNED_OUT') clearRecovery();
  if (ev === 'SIGNED_OUT' && !['auth', 'forgot', 'reset', 'verify', 'expired'].includes(view)) { view = 'auth'; render(); }
}

// Arranque en modo supabase: restaura la sesión y detecta errores en el link (por ejemplo, vencido).
function liveBoot(session) {
  const h = (location.hash || '') + '&' + (location.search || '');
  if (/error_code=otp_expired|error=access_denied/.test(h)) { view = 'expired'; render(); return; }
  if (/type=recovery/.test(h)) return; // lo maneja PASSWORD_RECOVERY
  // Sesión que viene de un link de recuperación: se queda en "crear contraseña nueva", nunca entra al portal.
  if (session && (recoveryFlag() || isRecoverySession(session))) { view = 'reset'; render(); return; }
  { const tk = liveInviteToken(); if (tk && !session) { liveInviteBoot(tk); return; } }
  if (session) {
    (async () => {
      let adm = false; try { adm = await api.isAdmin(); } catch (e) { /* sin permiso */ }
      if (api.isMerchant(session.user) || adm) liveAfterLogin(/type=signup|type=email/.test(h));
      else { await api.signOut(); view = 'auth'; render(); }
    })();
  }
}

// Horario legible: agrupa días consecutivos con el mismo horario.
function liveFmtSched(s) {
  if (!Array.isArray(s) || s.length !== 7) return '—';
  const N = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const h = (t) => String(t || '').replace(/^0/, '');
  const key = (d) => (d && d.on && d.r && d.r[0]) ? h(d.r[0][0]) + '–' + h(d.r[0][1]) : 'cerrado';
  const out = []; let i = 0;
  while (i < 7) { let j = i; while (j + 1 < 7 && key(s[j + 1]) === key(s[i])) j++; out.push((j > i ? N[i] + ' a ' + N[j] : N[i]) + ' ' + key(s[i])); i = j + 1; }
  return out.join(' · ');
}

// Achica la imagen antes de subirla: fotos a 1600 px y logo a 1000 px, para que la app y el portal carguen rápido.
async function compressImage(file, kind) {
  const maxDim = kind === 'logo' ? 1000 : 1600;
  try {
    let bmp;
    if (window.createImageBitmap) { try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await createImageBitmap(file); } }
    else { bmp = await new Promise((ok, ko) => { const im = new Image(), u = URL.createObjectURL(file); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = ko; im.src = u; }); }
    const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, maxDim / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); 
    const png = kind === 'logo' && file.type === 'image/png';
    if (!png) { cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h); }
    cx.drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise((res) => cv.toBlob(res, png ? 'image/png' : 'image/jpeg', 0.85));
    if (!blob) return file;
    if (blob.size >= file.size && file.size <= 5 * 1024 * 1024) return file;
    const ext = png ? 'png' : 'jpg';
    return new File([blob], (file.name || 'imagen').replace(/\.[^.]+$/, '') + '.' + ext, { type: blob.type });
  } catch (e) { return file; }
}

  if (!liveMerchantId) { toast('Primero completá los datos del onboarding.'); return; }
  toast('Procesando imagen…');
  const file = await compressImage(file0, kind);
  if (file.size > 5 * 1024 * 1024) { toast('La imagen sigue pesando demasiado. Probá con otra.'); return; }
  toast('Subiendo imagen…');
  const r = await api.uploadMedia(file, liveMerchantId);
  if (!r.ok) { toast(r.error); return; }
  if (kind === 'logo') logo = { n: file0.name, u: r.url, url: r.url }; else photos.push({ n: file0.name, u: r.url, url: r.url });
  render();
}

async function liveSend(btn) {
  btn.disabled = true;
  try {
    if (!(await liveSaveDraft())) return;
    const r = await api.submitRequest(liveReqId);
    if (!r.ok) {
      if (r.incomplete) {
        const N = { name: 'el nombre', address: 'la dirección', province: 'la provincia', neighborhood: 'el barrio', logo_url: 'el logo', photos: 'las fotos (mínimo 3)', services: 'los servicios', daily_stock: 'el cupo (mínimo 5)', schedule: 'los horarios', contract: 'la aceptación de las condiciones del servicio' };
        toast('Falta completar: ' + r.incomplete.map((k) => N[k] || k).join(', ') + '.');
      } else toast(r.error);
      return;
    }
    { const d = new Date(); window.__subDate = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
    status = 'pendiente'; view = 'm-pend'; mview = 'inicio'; render();
    toast('Adhesión enviada. Te avisamos por email cuando la revisemos.');
  } finally { btn.disabled = false; }
}

function parseCoords(t) {
  const s = (t || '').trim();
  let m = s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) || s.match(/(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  return lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 ? { lat, lng } : null;
}
// Geocodificación automática (OpenStreetMap / Nominatim). El admin siempre puede corregir el valor.
async function liveGeocode(r) {
  if (r.pinLat != null && r.pinLng != null) return { lat: r.pinLat, lng: r.pinLng, label: 'ubicación confirmada por el local en el mapa' };
  const fromMaps = parseCoords(r.maps || '');
  if (fromMaps) return { lat: fromMaps.lat, lng: fromMaps.lng, label: 'tomado del link de Google Maps del local' };
  const tries = [
    [r.dir, r.b !== '—' ? r.b : '', r.prov, 'Argentina'],
    [r.dir, r.prov, 'Argentina'],
  ];
  for (const parts of tries) {
    const q = parts.filter(Boolean).join(', ');
    if (!q) continue;
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ar&accept-language=es&q=' + encodeURIComponent(q));
      if (!res.ok) continue;
      const a = await res.json();
      if (a && a[0]) return { lat: +(+a[0].lat).toFixed(7), lng: +(+a[0].lon).toFixed(7), label: a[0].display_name };
    } catch (e) { /* sin red o bloqueado: queda manual */ }
  }
  return null;
}

// Solo si no se pudo ubicar la dirección automáticamente: se pide la ubicación a mano.
function liveApproveManual(r) {
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:#2b1d1699;z-index:90;display:grid;place-items:center;padding:16px';
  m.innerHTML = `<div class="card" style="max-width:480px;width:100%;margin:0"><h2>Aprobar y publicar: ${esc(r.n)}</h2>
  <p class="muted" style="margin:6px 0 14px">Se crea el local con su código de canje de 5 dígitos. Queda <b>inactivo</b>: no aparece en la app hasta que lo actives.</p>
  <div class="field"><label for="ap_c">Ubicación en el mapa <span class="req" aria-hidden="true">*</span></label>
  <input id="ap_c" placeholder="Buscando la ubicación de ${esc(r.dir)}…" value="${esc(r.maps || '')}">
  <div class="hint" id="ap_h">Buscando la ubicación automáticamente…</div><div class="ferr" id="ap_e" role="alert"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="ap_x">Cancelar</button><button class="btn ok" id="ap_ok">Aprobar</button></div></div>`;
  document.body.append(m);
  m.querySelector('#ap_x').onclick = () => m.remove();
  const inp = m.querySelector('#ap_c'), hint = m.querySelector('#ap_h');
  liveGeocode(r).then((g) => {
    if (!m.isConnected) return;
    if (g) {
      if (!inp.value.trim() || !parseCoords(inp.value)) inp.value = g.lat + ', ' + g.lng;
      hint.innerHTML = 'Ubicación encontrada automáticamente (' + esc(g.label) + '). <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + g.lat + ',' + g.lng + '">Verificar en Google Maps</a>. Si no es correcta, pegá otras coordenadas o un link de Google Maps.';
    } else {
      inp.placeholder = "Pegá el link de Google Maps o 'lat, lng' (ej: -34.5875, -58.4210)";
      hint.textContent = 'No pudimos ubicar la dirección (' + r.dir + ') automáticamente. Abrila en Google Maps y pegá el link o las coordenadas.';
    }
  });
  m.querySelector('#ap_ok').onclick = async () => {
    const c = parseCoords(inp.value);
    if (!c) { m.querySelector('#ap_e').textContent = 'No pudimos leer las coordenadas. Pegá "lat, lng" o un link de Google Maps con @lat,lng.'; return; }
    const b = m.querySelector('#ap_ok'); b.disabled = true;
    const x = await api.approveRequest(r.id, c.lat, c.lng);
    if (!x.ok) { b.disabled = false; m.querySelector('#ap_e').textContent = x.error; return; }
    m.remove(); await liveLoadRequests(); await liveLoadAdmin(); render();
    toast('Aprobado. Código de canje: ' + x.code + ' (el local queda inactivo hasta activarlo).');
  };
}

async function liveSetActive(r, active) {
  const x = await api.setCafeActive(r.id, active);
  if (!x.ok) { toast(x.error); return; }
  (LIVE_ADMIN.cafeState = LIVE_ADMIN.cafeState || {})[r.id] = !!active; render();
  toast(active ? 'Listo: el local ya figura en la app.' : 'Listo: el local dejó de figurar en la app.');
}

<script>
/* Render principal, barra de demo y marco de login/registro */
function render(){
 document.documentElement.dataset.theme=(['auth','onb','verify','expired','forgot','reset','invite'].includes(view))?'light':panelTheme;

function schedModal(){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:#2b1d1699;z-index:90;display:grid;place-items:center;padding:16px';m.innerHTML=`<div class="card" style="max-width:440px;width:100%;margin:0"><h2>Programar una pausa</h2><p class="muted" style="margin:6px 0 14px">En esas fechas tu local figura como cerrado en la app y no recibe canjes. Se reactiva solo al terminar, sin que hagas nada. Te enviamos un email de confirmación.</p><div class="grid g2"><div class="field"><label>Desde *</label><input type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-date id="sd"></div><div class="field"><label>Hasta *</label><input type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-date id="sh"></div></div><div class="field"><label>Motivo</label><select id="sr"><option>Vacaciones</option><option>Fuerza mayor</option><option>Refacciones / obra</option><option>Otro</option></select></div><p class="err" id="se" style="display:none;margin-bottom:10px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="sc">Cancelar</button><button class="btn" id="sk">Programar</button></div></div>`;document.body.append(m);mountModal(m);m.querySelector('#sc').onclick=()=>m.remove();m.querySelector('#sk').onclick=()=>{const d=dIso(m.querySelector('#sd').value),h=dIso(m.querySelector('#sh').value),e=m.querySelector('#se');if(!d||!h||h<d){e.style.display='block';e.textContent=!d||!h?'Necesitamos las dos fechas en formato dd/mm/aaaa.':'La fecha final debe ser igual o posterior a la inicial.';return}const f=v=>v.split('-').reverse().slice(0,2).join('/');const rs=m.querySelector('#sr').value;
  if(api.live){if(h<clToday()){e.style.display='block';e.textContent='Ese período ya pasó. Elegí fechas de hoy en adelante.';return}const kb=m.querySelector('#sk');kb.disabled=true;
   api._rpc('add_my_closure',{p_from:d,p_to:h,p_request:liveReqId||null,p_reason:rs}).then(x=>{kb.disabled=false;if(!x.ok){e.style.display='block';e.textContent=x.error;return}window.__closures=x.data||[];syncPause();m.remove();render();toast('Pausa programada. Te enviamos un email de confirmación.')});return}

 <span></span></div>`).join('')}</div><details class="card fold" ${closuresList().length||window.__clOpen?'open':''}><summary><h2>Días cerrados especiales</h2></summary>${closuresHtml()}<div class="grid g3" style="margin-top:12px"><div><label for="cl_f">Desde</label><input id="cl_f" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-date></div><div><label for="cl_t">Hasta</label><input id="cl_t" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-date></div><div style="align-self:end"><button class="btn sec" data-cl-add>Agregar cierre</button></div></div><div class="ferr" id="cl_e" role="alert"></div><p class="hint" style="margin-top:8px">Feriados y vacaciones. Se aplican de inmediato: la app muestra el local como "cerrado" y no permite canjes esos días. Para un solo día, poné la misma fecha en "Desde" y "Hasta".</p></details></div><div class="stack">

<script>
/* Mi adhesión, onboarding, Cómo canjear, Mi cuenta */
const CONTRATO=`CONTRATO DE ADHESIÓN PARA COMERCIOS — CAFETEANDO
(Texto de ejemplo: se reemplaza por el contrato real en PDF.)

1. Objeto. El Comercio adhiere al programa Cafeteando y se compromete a entregar a los socios activos un café de especialidad, al presentar su código de canje. Las variedades disponibles las define el Comercio al momento del canje.

2. Cupo y disponibilidad. El Comercio define su cupo diario y sus horarios, y puede modificarlos desde el portal. Los canjes ya realizados en el día se respetan ante cualquier cambio.

3. Gratuidad. La adhesión es gratuita. No hay pagos entre las partes: Cafeteando acerca clientes al Comercio y el Comercio aporta el café del canje.

4. Uso de marca. El Comercio autoriza a Cafeteando a mostrar su nombre, logo y fotos en la app y en sus canales.

5. Vigencia y baja. El contrato rige por tiempo indeterminado y cualquiera de las partes puede darlo de baja con 15 días de aviso.

6. Datos personales. Las partes tratarán los datos conforme a la Ley 25.326 y la Política de Privacidad de Cafeteando.

7. Activación. La adhesión se activa únicamente cuando Cafeteando la aprueba. Crear la cuenta o enviar el formulario no implica activación.`;

 const contrato=pre?resumen:`<div class="card" ${upd?'style="border:2px solid var(--terracota)"':''}><h2>Condiciones del servicio${upd?` — nueva versión ${lc.v}`:''}</h2>

  <div style="max-height:min(60vh,520px);overflow:auto;background:var(--crema-clara);border:1.5px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:13px">${txt}</div>

  <span style="display:flex;gap:8px">${upd?'<button class="btn sm" data-acc2 disabled style="opacity:.4;cursor:not-allowed">Aceptar versión '+lc.v+'</button>':''}<button class="btn sec sm" data-dl>Descargar PDF</button></span></div></div>`;
 const histLive=()=>{const H=window.__histRaw||{},dm=iso=>{try{const d=new Date(iso),p2=x=>String(x).padStart(2,'0');return p2(d.getDate())+'/'+p2(d.getMonth()+1)}catch(e){return ''}};
  const ev=[];const N=(window.__notifs||[]).filter(x=>x.request_id===H.rid);const T={pending:'Enviaste la adhesión',needs_fix:'Cafeteando te pidió correcciones',approved:'Cafeteando aprobó tu local',rejected:'Cafeteando rechazó tu solicitud'};

 const hist=api.live?`<details class="card fold"><summary><h2>Historial</h2></summary><ul class="log" style="margin-top:10px">${histLive()}</ul></details>`:`<details class="card fold"><summary><h2>Historial</h2></summary><ul class="log" style="margin-top:10px">${status!=='borrador'?`<li>${subDate()} · Enviaste la adhesión y aceptaste las condiciones del servicio v1.0</li>${accV!=='1.0'?`<li>${latestC().date.slice(0,5)} · Aceptaste la versión ${accV} de las condiciones del servicio</li>`:''}`:''}${status==='aprobado'?'<li>16/10 · Cafeteando aprobó tu local</li>':''}<li>12/10 · Completaste tus datos básicos</li><li>12/10 · Creaste tu cuenta</li></ul></details>`;
 const send= (status==='borrador'||status==='correccion')?`<div class="card"><h2>Algo más para contarnos (opcional)</h2>${fld({id:'cm_extra',label:'Si hay algo que quieras que sepamos al revisar tu local, escribilo acá.',tag:'textarea',rows:2})}</div><details class="card guide" style="padding:14px 18px"><summary>¿Qué datos son obligatorios?</summary><p style="margin:8px 0 4px"><b>Obligatorios:</b> nombre del local, persona de contacto, rol, teléfono o WhatsApp, dirección (provincia y ciudad o barrio), horarios y días de atención, cupo diario (mínimo 5), servicios (al menos uno), logo, fotos (mínimo 3).</p><p style="margin:4px 0"><b>Opcionales:</b> razón social, CUIT, redes, cómo te enteraste, link de Google Maps, descripción, beneficios adicionales y comentarios.</p></details><div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><b>${status==='correccion'?'Reenviar a revisión':'Enviar a revisión'}</b><p class="muted">${all?'¡Listo! Con esto Cafeteando ya puede revisar tu local.':'Para poder enviarla te falta completar: '+[!doneCafe&&'Mi cafetería',!doneDisp&&'Disponibilidad',!api.live&&!contractOk&&'aceptar las condiciones del servicio'].filter(Boolean).join(' y ')+'.'}</p></div><button class="btn" data-send ${all?'':'disabled style="opacity:.4;cursor:not-allowed"'}>Enviar adhesión</button></div>`:'';
 return header+'<div class="cols2"><div>'+contrato+'</div><div class="stack">'+send+hist+'</div></div>'}

 `<div class="grid g2">${fld({id:'ob_titular',label:'Nombre y apellido de la persona de contacto',rules:'req',ac:'name'})}${fld({id:'ob_rol',label:'¿Cuál es tu rol en el local?',rules:'req',tag:'select',opts:ROLES_L,ph:'Contanos cuál es tu rol'})}${FD.ob_rol==='Otro'?fld({id:'ob_rol_otro',label:'¿Cuál?',rules:'req'}):''}${fld({id:'ob_wsp',label:'Teléfono o WhatsApp',rules:'req,phone',type:'tel',ph:'11 1234-5678',ac:'tel'})}${fld({id:'ob_mail',label:'Correo de contacto (si es distinto al de tu cuenta, opcional)',rules:'email',type:'email'})}</div>`,
 `${addrField()}${fld({id:'ob_maps',label:'Link de Google Maps de tu local (opcional)',rules:'url',ph:'https://maps.app.goo.gl/...'})}`];
 if(newBranch){f.splice(1,1);f[0]=fld({id:'ob_name',label:'Nombre de la sucursal',rules:'req',def:'',hint:'Puede ser el mismo nombre de tu cafetería u otro.'})}

 <div class="card"><div class="grid g2">${st.map(([t,d],i)=>`<div style="display:flex;gap:12px"><div class="kpi" style="font-size:26px;min-width:30px">${i+1}</div><div><h3>${t}</h3><p class="muted">${d}</p></div></div>`).join('')}</div></div>

function mCuenta(){return `<div class="top"><h1>Mi cuenta</h1></div><div class="cols lastfull"><div class="card"><div class="acc-av"><div class="av big">${avatarInner()}</div><div class="acc-avt"><h2 style="margin:0 0 2px">Foto del portal de comercios</h2><p class="hint">JPG, PNG o WebP.</p><div class="acc-avb"><button class="btn sec sm" data-av-up>${window.__avatar?'Cambiar foto':'Subir foto'}</button>${window.__avatar?'<button class="btn sec sm" data-av-del>Quitar</button>':''}<input type="file" id="avfile" accept="image/png,image/jpeg,image/webp" hidden></div></div></div><div class="grid g2"><div class="field"><label>Email</label><input value="${esc(bizMail())}" disabled><p class="hint" style="margin-top:6px">Este email es solo para el portal de comercios. Si querés usar la app como cliente, registrate con otro email.</p></div>${fld({id:'ac_phone',label:'Teléfono',rules:'req,phone',type:'tel',def:api.live?(FD.ob_wsp||''):'11 5555-1234',ac:'tel'})}</div><button class="btn sm" data-phone-save>Guardar</button></div><div class="card"><h2>Avisos por email</h2><p class="muted" style="margin:10px 0 12px">Te escribimos a ${esc(bizMail())}.</p>${[['Cambios en el estado de tu adhesión (aprobada, correcciones, rechazo)','',true],['Cambios publicados o rechazados en tu cafetería','',true],['Recordatorio antes de que termine una pausa programada','pause_reminder',false],['Novedades de Cafeteando','news',false]].map(([l,k,lock])=>`<div style="display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)"><span>${l}</span>${lock?'<span class="badge b-aprobado" style="white-space:nowrap">Siempre activo</span>':`<button type="button" class="toggle ${emailPrefs[k]?'on':''}" data-tg="${k}" aria-label="${l}"></button>`}</div>`).join('')}</div><div class="card"><h2>Documentos legales</h2><p style="margin-top:8px"><a href="#" data-legal="terminos">Términos y condiciones</a> · <a href="#" data-legal="privacidad">Política de priva function adminCh(r){const o={rows:{},any:[],imgChanged:false,newImgs:new Set()};if(!api.live||!r||r.s!=='pendiente'||!r.prevRaw||!r.raw)return o;

 const bn=p=>Array.isArray(p.benefits)&&p.benefits.length?p.benefits.map(x=>x.text).join(' · '):'Sin beneficio adicional';
 if(J(a.name)!==J(b.name))add('n','Nombre',a.name||'—');
 if(['address','neighborhood','province','lat','lng'].some(k=>J(a[k])!==J(b[k])))add('dir','Dirección y ubicación',[a.address,a.neighborhood].filter(Boolean).join(', ')||'—');

 if(J(a.daily_stock)!==J(b.daily_stock))add('cupo','Cupo diario',a.daily_stock||'—');
 if(J(a.services)!==J(b.services)||J(a.other_services)!==J(b.other_services))add('serv','Servicios',sv(a));
 if(J(a.description)!==J(b.description))add('desc','Descripción',a.description||'Sin descripción');
 if(J(a.benefits)!==J(b.benefits))add('benef','Beneficios',bn(a));
 const pa=Array.isArray(a.photos)?a.photos:[],pb=Array.isArray(b.photos)?b.photos:[];

 if(o.newImgs.size||J(pa)!==J(pb)){o.imgChanged=true;o.any.push('Fotos o logo')}
 return o}

<script>
/* Framework de formularios, validaciones y direcciones */
/* ---------- formularios: campos, validación, ojito ---------- */
const FD={},TOUCH={};const MISMATCH='Las contraseñas no coinciden.';
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
const RULES={
 req:v=>v.trim()?'':'Necesitamos este dato para continuar.',
 email:v=>!v.trim()||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?'':'Parece que falta algo en el email. Debería verse como nombre@dominio.com.',
 cuit:v=>!v.trim()||v.replace(/\D/g,'').length===11?'':'El CUIT debe tener 11 dígitos (ej: 20-12345678-9).',
 phone:v=>!v.trim()||/^\d{8,13}$/.test(v.replace(/[\s\-+()]/g,''))?'':'Necesitamos un teléfono con código de área, solo números (ej: 11 1234-5678).',
 url:v=>!v.trim()||/^https?:\/\/\S+\.\S+/.test(v.trim())?'':'Pegá el link completo, que empieza con https:// (ej: https://maps.app.goo.gl/...)',
 insta:v=>!v.trim()||/^@?[A-Za-z0-9._]{1,30}$/.test(v.trim())?'':'Usuario de Instagram inválido (ej: @tucafeteria).',
 pass:v=>v.length>=8&&/[A-Za-z]/.test(v)&&/\d/.test(v)?'':'Mínimo 8 caracteres, con al menos una letra y un número.',
 max240:v=>v.length<=240?'':'Máximo 240 caracteres.',
 max200:v=>v.length<=200?'':'Máximo 200 caracteres.',
 social:v=>!v.trim()||/^@?[A-Za-z0-9._]{1,30}$/.test(v.trim())||/^(https?:\/\/)?[\w-]+(\.[\w-]+)+\S*$/.test(v.trim())?'':'Podés escribir un usuario (@tucafeteria) o un link (https://...).'};
function check(el){const rules=(el.dataset.rules||'').split(',').filter(Boolean);
 for(const r of rules){if(r==='match'){const o=document.getElementById(el.dataset.match);if(el.value!==(o?o.value:''))return MISMATCH;continue}const m=RULES[r](el.value);if(m)return m}return ''}
function showErr(el,msg){el.classList.toggle('invalid',!!msg);el.setAttribute('aria-invalid',msg?'true':'false');const b=document.getElementById('err-'+el.id);if(b)b.textContent=msg===MISMATCH?'':msg}
function fld(o){const id=o.id,rules=o.rules||'',req=rules.split(',').includes('req');const v=FD[id]!==undefined?FD[id]:(o.def||'');
 const lab=`<label for="${id}">${o.label}${req?' <span class="req" aria-hidden="true">*</span><span class="sr"> (obligatorio)</span>':''}</label>`;
 const c=`id="${id}" data-f data-rules="${rules}" ${o.match?`data-match="${o.match}"`:''} aria-describedby="err-${id}${o.hint?' hint-'+id:''}" ${req?'aria-required="true"':''} ${o.ph?`placeholder="${o.ph}"`:''} ${o.max?`maxlength="${o.max}"`:''} ${o.ac?`autocomplete="${o.ac}"`:''} ${o.list?`list="${o.list}"`:''}`;
 let ctl;
 if(o.tag==='textarea')ctl=`<textarea ${c} rows="${o.rows||3}">${esc(v)}</textarea>`;
 else if(o.tag==='select')ctl=`<select ${c}><option value="">${o.ph||'Falta elegir una opción'}</option>${o.opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
 else if(o.eye)ctl=`<div class="pw"><input type="password" ${c} value="${esc(v)}"><button type="button" class="eye" data-eye="${id}" aria-label="Mostrar contraseña" aria-pressed="false">${EYE}</button></div>`;
 else ctl=`<input type="${o.type||'text'}" ${c} value="${esc(v)}">`;
 return `<div class="field">${lab}${ctl}<div class="fmeta">${o.list?`<datalist id="${o.list}">${o.listOpts.map(x=>`<option value="${x}">`).join('')}</datalist>`:''}${o.hint?`<div class="hint" id="hint-${id}">${o.hint}</div>`:''}<div class="ferr" id="err-${id}" role="alert"></div></div></div>`}
function validateGroup(root){let first=null;
 root.querySelectorAll('[data-f]').forEach(el=>{TOUCH[el.id]=1;const m=check(el);showErr(el,m);if(m&&!first)first=el});
 const ad=root.querySelector('[data-addr-in]');if(ad&&!addrSel){TOUCH.ad_in=1;showAddrErr('Para ubicarla en el mapa, elegí una dirección de la lista.');if(!first)first=ad}
 if(first){first.focus();first.scrollIntoView&&first.scrollIntoView({block:'center'})}return !first}
function setRule(id,ok){const e=document.getElementById(id);if(e)e.classList.toggle('ok',!!ok)}
function onField(el){const q1=document.getElementById('ac_p1'),q2=document.getElementById('ac_p2');
 if(q1&&q2){const a=q1.value,b=q2.value,m=document.getElementById('pc-match');
  if(m){if(b){if(a===b){m.textContent='Las contraseñas coinciden';m.className='pmatch ok'}else{m.textContent=MISMATCH;m.className='pmatch bad'}}else{m.textContent='';m.className='pmatch'}}
  if(el&&el.id==='ac_p1'&&(b||TOUCH.ac_p2))showErr(q2,check(q2))}
 const p1=document.getElementById('r_p1'),p2=document.getElementById('r_p2');if(!p1||!p2)return;
 const a=p1.value,b=p2.value;setRule('pr-len',a.length>=8);setRule('pr-mix',/[A-Za-z]/.test(a)&&/\d/.test(a));
 const m=document.getElementById('pr-match');
 if(b){if(a===b){m.textContent='Las contraseñas coinciden';m.className='pmatch ok'}else{m.textContent=MISMATCH;m.className='pmatch bad'}}else{m.textContent='';m.className='pmatch'}
 if(el&&el.id==='r_p1'&&(b||TOUCH.r_p2))showErr(p2,check(p2))}
function bindForms(){
 document.querySelectorAll('[data-f]').forEach(el=>{
  el.addEventListener('input',()=>{FD[el.id]=el.value;if(TOUCH[el.id]||el.classList.contains('invalid'))showErr(el,check(el));onField(el)});
  el.addEventListener('change',()=>{FD[el.id]=el.value;if(el.id==='ob_rol'){render();const n=document.getElementById('ob_rol');n&&n.focus()}if(el.id==='ad_prov'){const cb=curBarrio();if(el.value===CABA){if(!BARRIOS.includes(cb))FD.ad_b=''}else if(BARRIOS.includes(cb))FD.ad_b='';render();const n=document.getElementById('ad_prov');n&&n.focus()}});
  el.addEventListener('blur',()=>{if(CAP_MODE[el.id]){const nv=capAuto(el.id,el.value.trim());if(nv!==el.value){el.value=nv;FD[el.id]=nv}}TOUCH[el.id]=1;showErr(el,check(el));onField(el)});
  if(TOUCH[el.id])showErr(el,check(el))});
 document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);const show=i.type==='password';i.type=show?'text':'password';b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.innerHTML=show?EYEOFF:EYE});
 onField(null);bindAddr()}

/* ---------- dirección con autocompletado y mapa ---------- */
const BARRIOS=['Agronomía','Almagro','Balvanera','Barracas','Belgrano','Boedo','Caballito','Chacarita','Coghlan','Colegiales','Constitución','Flores','Floresta','La Boca','La Paternal','Liniers','Mataderos','Monte Castro','Montserrat','Nueva Pompeya','Núñez','Palermo','Parque Avellaneda','Parque Chacabuco','Parque Chas','Parque Patricios','Puerto Madero','Recoleta','Retiro','Saavedra','San Cristóbal','San Nicolás','San Telmo','Vélez Sarsfield','Versalles','Villa Crespo','Villa del Parque','Villa Devoto','Villa General Mitre','Villa Lugano','Villa Luro','Villa Ortúzar','Villa Pueyrredón','Villa Real','Villa Riachuelo','Villa Santa Rita','Villa Soldati','Villa Urquiza'];
const ADDRS=[['Bonpland 1500','Palermo'],['Bonpland 1620','Palermo'],['Thames 1800','Palermo'],['Honduras 4800','Palermo'],['Av. Cabildo 2200','Belgrano'],['Av. Cabildo 2450','Belgrano'],['Av. Corrientes 5100','Villa Crespo'],['Scalabrini Ortiz 1200','Villa Crespo'],['Defensa 900','San Telmo'],['Av. Santa Fe 2900','Recoleta'],['Av. Rivadavia 4200','Almagro'],['Av. Juan B. Justo 3000','Colegiales'],['Av. Rivadavia 5100','Caballito'],['Av. del Libertador 7500','Núñez']];
const PROVS=["Ciudad Autónoma de Buenos Aires", "Buenos Aires", "Catamarca", "Chaco", "Chubut", "Córdoba", "Corrientes", "Entre Ríos", "Formosa", "Jujuy", "La Pampa", "La Rioja", "Mendoza", "Misiones", "Neuquén", "Río Negro", "Salta", "San Juan", "San Luis", "Santa Cruz", "Santa Fe", "Santiago del Estero", "Tierra del Fuego", "Tucumán"];
const CABA='Ciudad Autónoma de Buenos Aires';
const curBarrio=()=>FD.ad_b!==undefined?FD.ad_b:(addrSel?addrSel.b:'');
/* Mayúscula inicial automática: nombres de personas (cada palabra) y de locales (primera letra). No toca el resto de las letras. */
const CAP_MODE={r_name:'first',ob_name:'first',cf_name:'first',ob_titular:'words',ob_rol_otro:'first',sg_name:'words'};
const NAME_LOW=new Set(['de','del','la','las','los','el','y','e','da','do','van','von','di']);
function capAuto(id,t){const m=CAP_MODE[id];if(!m)return t;t=String(t||'').replace(/^\s+/,'').replace(/\s{2,}/g,' ');if(m==='first')return t.charAt(0).toUpperCase()+t.slice(1);return t.split(' ').map((w,i)=>(!w||(i>0&&NAME_LOW.has(w.toLowerCase())&&w===w.toLowerCase()))?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
const ADDR_LOW=new Set(['de','del','la','las','los','el','y','e','a','en']);
function capAddr(t){return String(t||'').trim().replace(/\s+/g,' ').split(' ').map((w,i)=>{if(!w)return w;const l=w.toLowerCase();if(i>0&&ADDR_LOW.has(l))return l;return l.charAt(0).toUpperCase()+l.slice(1)}).join(' ')}
let addrSel={a:'Bonpland 1500',b:'Palermo'},addrText='',pin={x:52,y:46};
function showAddrErr(m){const i=document.getElementById('ad_in');if(!i)return;i.classList.toggle('invalid',!!m);i.setAttribute('aria-invalid',m?'true':'false');const b=document.getElementById('err-ad_in');if(b)b.textContent=m}
function addrField(){const sel=addrSel;const v=sel?(sel.custom?sel.a:sel.a+', '+sel.b):addrText;const bval=FD.ad_b!==undefined?FD.ad_b:(sel?sel.b:'');
 return `<div class="field addrf"><label for="ad_in">Dirección <span class="req" aria-hidden="true">*</span><span class="sr"> (obligatorio)</span></label><div class="addrwrap"><input id="ad_in" data-addr-in autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ad_list" aria-describedby="hint-ad_in err-ad_in" aria-required="true" placeholder="Empezá a escribir calle y número" value="${esc(v)}"><ul id="ad_list" class="sugg" role="listbox" aria-label="Direcciones sugeridas" hidden></ul></div><div class="hint" id="hint-ad_in">Escribí tu dirección y elegí una opción de la lista para ubicar tu local en el mapa. ${api.live?'Si hay varias con el mismo nombre, elegí la tuya según el barrio o la provincia.':'Si tu cafetería está en otra localidad, escribí la dirección completa y elegí "Usar como dirección".'} ${api.live?'':'(Simulado: en producción se conecta a un servicio de direcciones.)'}</div><div class="ferr" id="err-ad_in" role="alert"></div></div>
 <div class="grid g2">${fld({id:'ad_prov',label:'Provincia',rules:'req',tag:'select',opts:PROVS,def:(sel&&!sel.custom)?CABA:'',ph:'Falta elegir una provincia'})}${(()=>{const pv=FD.ad_prov!==undefined?FD.ad_prov:((sel&&!sel.custom)?CABA:'');return pv===CABA?fld({id:'ad_b',label:'Barrio',rules:'req',tag:'select',opts:(bval&&!BARRIOS.includes(bval))?BARRIOS.concat([bval]):BARRIOS,def:bval,ph:'Falta elegir un barrio'}):fld({id:'ad_b',label:'Ciudad o localidad',rules:'req',def:bval,ph:'Ej: Rosario',ac:'off'})})()}</div>
 ${sel?`<div class="mapbox"><div class="map" data-map-area><div class="pin" data-pin tabindex="0" role="img" aria-label="Pin de ubicación. Arrastralo o usá las flechas para ajustarlo." style="left:${pin.x}%;top:${pin.y}%"><svg viewBox="0 0 24 32" width="30" height="40" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20 12 32 12 32s12-12 12-20.3C24 5.2 18.6 0 12 0z" fill="#A96649"/><circle cx="12" cy="11.5" r="4.5" fill="#fff"/></svg></div></div><p class="hint" style="margin-top:6px">¿Confirmás que el pin está sobre tu local? Podés arrastrarlo para ajustarlo.</p></div>`:''}`}
const nzS=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function admFrom(a){const ad=a.address||{};const st=nzS(ad.state);let prov=PROVS.find(p=>nzS(p)===st);
 if(!prov&&(st.includes('ciudad autonoma')||(nzS(ad.city)==='buenos aires'&&!ad.state_district)))prov=CABA;
 let b='';
 if(prov===CABA){const cands=[ad.suburb,ad.neighbourhood,ad.quarter,ad.city_district,ad.borough,ad.village].filter(Boolean).map(nzS);
  b=BARRIOS.find(x=>cands.includes(nzS(x)))||BARRIOS.find(x=>cands.some(c=>c.includes(nzS(x))))||BARRIOS.find(x=>nzS(a.display_name).split(',').map(t=>t.trim()).includes(nzS(x)))||''}
 else b=ad.city||ad.town||ad.village||ad.municipality||ad.suburb||'';
 return{prov,b}}
// Direcciones repetidas (CABA / provincia / otras ciudades): se le muestran las opciones y elige la suya.
async function geoCands(q){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=25&addressdetails=1&countrycodes=ar&accept-language=es&q='+encodeURIComponent(q+', Argentina'));const a=await r.json();const seen=new Set();
 return (a||[]).filter(x=>x.address&&(x.address.house_number||x.address.road)).map(x=>{const m=admFrom(x);const ad=x.address;const loc=m.prov===CABA?(m.b||ad.suburb||'CABA'):(m.b||ad.city||ad.town||'');const label=[(ad.road||'')+(ad.house_number?' '+ad.house_number:''),loc,m.prov===CABA?'CABA':(m.prov||ad.state||'')].filter(Boolean).join(', ');return{x,m,label}}).filter(c=>!seen.has(c.label)&&seen.add(c.label)).sort((p,q2)=>{const rk=c=>c.m.prov===CABA?0:(c.m.prov==='Buenos Aires'?1:2);return rk(p)-rk(q2)}).slice(0,8)}catch(e){return[]}}
function bindAddr(){const inp=document.querySelector('[data-addr-in]');if(!inp)return;const list=document.getElementById('ad_list');let act=-1,items=[];
 const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant');act=-1};
 const mark=()=>{[...list.querySelectorAll('li[data-ai]')].forEach((li,i)=>li.classList.toggle('act',i===act));if(act>=0)inp.setAttribute('aria-activedescendant','ad_o'+act)};
