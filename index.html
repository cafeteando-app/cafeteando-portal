<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafeteando · Portal de comercios</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Red+Hat+Display:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#2B1D16;--accent:#8F513A;--nav-bg:#2B1D16;--nav-link:#ffffffcc;--nav-on-bg:#ffffff14;--nav-on-fg:#E58F6A;--nav-sub:#E3A784;--nav-hover:#ffffff0d;--nav-who:#ffffff0d;--nav-line:#ffffff14;--bad-text:#B3443A;--bg-neutral:#ECE6E0;--fg-neutral:#5A4F48;--bg-warn:#FFF1D6;--fg-warn:#9A6411;--bg-info:#E3EEF9;--fg-info:#2F5F94;--bg-ok:#DDF1E5;--fg-ok:#2F6A4A;--bg-bad:#F8DEDA;--fg-bad:#9C372E;--bg-susp:#EADDD6;--fg-susp:#6b3b28;--bg-note:#FFF8E6;--bg-local:#EFDDCB;--line-local:#E3A784;color-scheme:light;--terracota:#A96649;--terracota-oscuro:#8F513A;--terracota-claro:#E3A784;--crema:#F6EEE4;--crema-clara:#FBF7F1;--blanco:#fff;--espresso:#2B1D16;--muted:#6F5F55;--line:#E6D9CB;--ok:#3E7D5A;--warn:#B7791F;--bad:#B3443A;--info:#3B6EA5;--r:14px;--sh:0 2px 10px rgba(43,29,22,.08)}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--crema);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:'Red Hat Display',sans-serif;font-weight:800;line-height:1.2}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.demo{position:sticky;top:0;z-index:50;background:var(--espresso);color:#fff;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.demo b{color:var(--terracota-claro)}
.demo button{background:#ffffff1a;color:#fff;border:1px solid #ffffff40;border-radius:99px;padding:4px 12px;font-size:12px}
.demo button.on{background:var(--terracota);border-color:var(--terracota)}
.demo .sp{flex:1}
.btn{background:var(--terracota);color:#fff;border:0;border-radius:99px;padding:10px 20px;font-weight:600}
.btn:hover{background:var(--terracota-oscuro)}
.btn.sec{background:transparent;color:var(--accent);border:1.5px solid var(--terracota)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.card{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}
.b-borrador{background:var(--bg-neutral);color:var(--fg-neutral)}.b-pendiente{background:var(--bg-warn);color:var(--fg-warn)}.b-correccion{background:var(--bg-info);color:var(--fg-info)}.b-aprobado{background:var(--bg-ok);color:var(--fg-ok)}.b-rechazado{background:var(--bg-bad);color:var(--fg-bad)}.b-suspendido{background:var(--bg-susp);color:var(--fg-susp)}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--crema-clara);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--terracota-claro);border-color:var(--terracota)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--crema-clara);border-radius:99px;padding:6px 14px;font-size:13px}
.chip.on{background:var(--terracota);color:#fff;border-color:var(--terracota)}
/* auth */
.auth{min-height:calc(100vh - 40px);display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:var(--terracota);color:#fff;padding:60px 48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.auth .side h1{font-size:34px}.auth .side li{margin:8px 0 8px 18px}
.auth .form{display:flex;align-items:center;justify-content:center;padding:32px}
.auth .box{width:100%;max-width:400px}
.tabs{display:flex;gap:4px;background:var(--crema);border-radius:99px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;border-radius:99px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--blanco);color:var(--ink);box-shadow:var(--sh)}
@media(max-width:800px){.auth{grid-template-columns:1fr}.auth .side{padding:28px}}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 40px)}
.nav{background:var(--nav-bg);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.nav .logo{font-family:'Red Hat Display';font-weight:800;font-size:19px;padding:0 10px 4px}
.nav .sub{font-size:11px;color:var(--terracota-claro);padding:0 10px 16px;letter-spacing:.08em;text-transform:uppercase}
.nav a{color:#ffffffcc;text-decoration:none;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.nav a.on{background:var(--terracota);color:#fff}
.nav a:hover:not(.on){background:#ffffff14}
.nav .fill{flex:1}
.localbox{background:var(--bg-local);border:1.5px solid var(--line-local);border-radius:18px;padding:16px;margin-bottom:22px}
.lb-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.statusrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px dashed var(--terracota-claro);font-size:13px}
.statusrow>span:first-child{color:var(--muted);font-weight:600}.lb-code{margin-left:auto;color:var(--muted)}.lb-code b{color:var(--ink)}
.localbox .tabsbar{margin-bottom:6px}
.tabsbar{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
.ltab{display:flex;gap:10px;align-items:center;background:var(--blanco);border:2px solid var(--line);border-radius:14px;padding:8px 16px;text-align:left;white-space:nowrap;color:var(--ink)}
.ltab span{display:flex;flex-direction:column;line-height:1.2}.ltab small{color:var(--muted);font-size:11px}
.ltab.on{border-color:var(--terracota);background:var(--crema-clara);box-shadow:var(--sh)}
.ltab.add{border-style:dashed;color:var(--accent);font-weight:600;background:transparent}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--warn)}.d-ok{background:var(--ok)}.d-correccion{background:var(--info)}.d-off{background:#9a8f88}.d-rechazado{background:var(--bad)}
.swbar{display:flex;gap:10px;align-items:center;background:var(--blanco);border-radius:99px;padding:6px 8px 6px 16px;margin-bottom:16px;box-shadow:var(--sh);width:fit-content;max-width:100%}.swbar span{font-size:12px;color:var(--muted);font-weight:600}.swbar select{width:auto;border-radius:99px;padding:6px 12px}
.locrow{border:2px solid var(--line);border-radius:12px;padding:12px}
.locrow.here{border-color:var(--terracota);background:var(--crema-clara)}
.here-tag{background:var(--terracota);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.info{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--terracota);background:var(--blanco);color:var(--accent);font-weight:700;font-family:serif;font-style:italic;line-height:1}
.info[aria-expanded=true]{background:var(--terracota);color:#fff}
.infobox{margin-top:10px;padding:12px 14px;background:var(--blanco);border-radius:10px;border-left:4px solid var(--terracota)}.infobox p{margin:4px 0 10px;color:var(--muted)}
.who{background:#ffffff12;border-radius:12px;padding:12px;margin:40px 0 0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:#ffffffb3;word-break:break-all}.who b{color:#fff;font-size:14px}.who a{color:var(--terracota-claro);cursor:pointer;margin-top:6px;font-weight:600}
.nav .user{font-size:12px;color:#ffffff99;padding:10px}
.main{padding:28px;max-width:1440px;width:100%;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
@media(max-width:800px){.shell{grid-template-columns:1fr}.nav{flex-direction:row;overflow:auto;padding:10px}.nav .logo,.nav .sub,.nav .fill,.nav .user,.nav .who{display:none}.nav a{white-space:nowrap}.main{padding:16px}}
.banner{border-radius:var(--r);padding:16px 20px;margin-bottom:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.pend{background:var(--bg-warn)}.banner.corr{background:var(--bg-info)}.banner.ok{background:var(--bg-ok)}
.steps{display:flex;gap:0;margin:8px 0 6px}
.step{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:30px}
.step:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--muted);font-weight:600;display:grid;place-items:center}
.step:after{content:"";position:absolute;top:11px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:var(--line)}
.step:last-child:after{display:none}
.step.done:before{background:var(--ok);color:#fff;content:"✓"}.step.done:after{background:var(--ok)}
.step.cur:before{background:var(--terracota);color:#fff}.step.cur{color:var(--ink);font-weight:600}
.kpi{font-family:'Red Hat Display';font-size:30px;font-weight:800;color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click:hover{background:var(--crema-clara);cursor:pointer}
.drop{border:2px dashed var(--terracota-claro);border-radius:var(--r);padding:22px;text-align:center;background:var(--crema-clara);color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ph{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#d9b99f,#a96649);display:grid;place-items:center;color:#fff;font-size:11px;position:relative}
.ph.empty{background:var(--crema-clara);border:2px dashed var(--line);color:var(--muted)}
.ph.logo{background:var(--espresso);font-size:26px}
.log li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log{padding:0}
.week{display:grid;grid-template-columns:100px 60px 1fr 1fr 90px;gap:8px;align-items:center;margin-bottom:8px}
.week input[type=time]{padding:6px 8px}
@media(max-width:800px){.week{grid-template-columns:80px 50px 1fr 1fr}.week .cu{display:none}}
.week2{display:grid;grid-template-columns:100px 56px 1fr 40px;gap:10px;align-items:start;margin-bottom:12px}
.week2>b{padding-top:8px}.week2 .toggle{margin-top:6px}
.rngs{display:flex;flex-direction:column;gap:8px}
.rng{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rng input{width:130px;padding:6px 8px}
.rng .x{border:0;background:transparent;font-size:20px;color:var(--muted);line-height:1}
.err{color:var(--bad-text);font-weight:600}
.plus{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--terracota);background:var(--blanco);color:var(--accent);font-size:20px;line-height:1}
.plus:hover{background:var(--terracota);color:#fff}
@media(max-width:800px){.week2{grid-template-columns:80px 50px 1fr}.week2 .plus{grid-column:3;justify-self:start}}
.toggle{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;border:0}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:var(--ok)}.toggle.on:after{left:21px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#fff;padding:12px 22px;border-radius:99px;z-index:99;box-shadow:var(--sh)}
.note{background:var(--bg-note);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.phone{background:var(--espresso);border-radius:26px;padding:10px;width:240px}
.phone .scr{background:var(--crema);border-radius:18px;padding:14px;min-height:260px}
.pc{background:var(--blanco);border-radius:12px;padding:10px;margin-top:8px;font-size:12px}

[data-theme=dark]{--crema:#2B1E18;--crema-clara:#3D2C23;--blanco:#36271F;--line:#554235;--muted:#BFAEA2;--ink:#F6ECE1;--accent:#E8A07C;--nav-bg:#140D0A;--nav-link:#ffffffcc;--nav-on-bg:#ffffff14;--nav-on-fg:#E58F6A;--nav-sub:#E3A784;--nav-hover:#ffffff0d;--nav-who:#ffffff0d;--nav-line:#ffffff14;--bad-text:#F08A7E;--sh:0 2px 12px rgba(0,0,0,.45);--bg-neutral:#3A312C;--fg-neutral:#CFC3B9;--bg-warn:#4A3A17;--fg-warn:#F2C46B;--bg-info:#1F3550;--fg-info:#8DB8E8;--bg-ok:#1F4030;--fg-ok:#7FD1A0;--bg-bad:#4D2420;--fg-bad:#F19A91;--bg-susp:#4A3329;--fg-susp:#D9B39C;--bg-note:#3A2F18;--bg-local:#3F2D23;--line-local:#6A4C39;color-scheme:dark}
[data-theme=dark] .ph.empty,[data-theme=dark] .drop{background:var(--crema-clara)}
/* --- pulido general --- */
body{-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
h1{font-size:28px;letter-spacing:-.01em}h2{letter-spacing:-.005em}
.card{border:1px solid var(--line);box-shadow:0 1px 2px rgba(43,29,22,.04),0 6px 18px rgba(43,29,22,.05);padding:24px;transition:background .2s,border-color .2s}
[data-theme=dark] .card{box-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn{box-shadow:0 1px 2px rgba(43,29,22,.2);transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(169,102,73,.3)}
.btn:active{transform:none}
.btn.sec{box-shadow:none}.btn.sec:hover{background:var(--terracota);color:#fff}
.btn[disabled]{cursor:not-allowed}
input,select,textarea{transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--terracota);box-shadow:0 0 0 3px rgba(169,102,73,.25)}
.nav{position:relative}
.themeico{position:absolute;top:22px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff30;background:#ffffff12;color:#F3E9DE;display:grid;place-items:center;transition:background .15s}
.themeico:hover{background:#ffffff26}
@media(max-width:800px){.themeico{position:static;order:99;margin-left:auto;flex:none}}
.nav{background:linear-gradient(180deg,var(--nav-bg),var(--nav-bg));border-right:1px solid #ffffff10;padding:26px 14px}
.nav .logo{font-size:21px;letter-spacing:-.01em}

.nav a.on{background:#ffffff14;color:#E58F6A;font-weight:600}
.nav a.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--terracota-claro)}
.nav a:hover:not(.on){background:#ffffff0d;color:#fff}
.who{background:#ffffff0d;border:1px solid #ffffff14}
.who a{display:block}
.main{padding:32px 36px}
.top{margin-bottom:24px}
.grid.g3.kpis{margin-bottom:32px}
.grid.g3>.card{border-top:3px solid var(--terracota-claro);margin:0}
.kpi{font-size:36px;letter-spacing:-.02em}
.banner{border:1px solid var(--line)}
.localbox{box-shadow:var(--sh)}
.ltab{transition:border-color .15s,box-shadow .15s}.ltab:hover:not(.on){border-color:var(--terracota-claro)}
.auth .side{background:linear-gradient(155deg,var(--terracota),#7d4530)}
.badge{letter-spacing:.01em}
th{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
::selection{background:var(--terracota);color:#fff}
@media(max-width:800px){.main{padding:18px 16px}.nav a.on:before{display:none}}
.nav{border-right:0}
.nav .sub{color:var(--nav-sub)}
.nav a{color:var(--nav-link)}
.nav a.on{background:var(--nav-on-bg);color:var(--nav-on-fg)}
.nav a.on:before{background:var(--nav-on-fg)}
.nav a:hover:not(.on){background:var(--nav-hover);color:#fff}
.who{background:var(--nav-who);border:1px solid var(--nav-line);color:var(--nav-link)}
.who a{color:#fff}
.themeico{border-color:var(--nav-line);background:var(--nav-who);color:#fff}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--terracota-claro),var(--terracota))}
.chart{display:flex;gap:10px;align-items:flex-end;height:170px;margin-top:14px}

.chart .v{font-size:11px;color:var(--muted)}.chart small{font-size:11px;color:var(--muted)}
.cafegrid{grid-template-columns:1fr 260px;align-items:start}
.log li .badge{margin-right:8px}

}

.who-head{display:flex;gap:10px;align-items:center;min-width:0}
.who .av{width:36px;height:36px;border-radius:50%;background:var(--terracota);color:#fff;display:grid;place-items:center;font-weight:800;font-family:'Red Hat Display';flex:none}
.who .wi{display:flex;flex-direction:column;min-width:0;flex:1}

<script>
/* Textos legales (Términos y Política de Privacidad de la app). Contenido de ejemplo hasta tener los términos específicos de comercios. */
const LEGAL={"terminos": {"t": "Términos y condiciones", "h": "<h2>1. Aceptación<\/h2>\n<p>Al registrarte y utilizar CAFETEANDO, declarás haber leído y aceptado estos Términos y Condiciones y la Política de Privacidad.<\/p>\n<p>Si no estás de acuerdo con estos términos, no podrás utilizar el servicio.<\/p>\n<p>Estos Términos y Condiciones regulan la relación entre el usuario y <strong>CAFETEANDO<\/strong> respecto del uso de la aplicación y del servicio de membresía.<\/p>\n<h2>2. El servicio<\/h2>\n<p>CAFETEANDO es una plataforma de membresía que permite a sus usuarios acceder a un <strong>Café de la Membresía por día<\/strong> en establecimientos adheridos a la red CAFETEANDO, de acuerdo con las condiciones y límites establecidos en estos Términos y Condiciones.<\/p>\n<p>El servicio se presta mediante la aplicación móvil y/o las plataformas digitales oficiales de CAFETEANDO.<\/p>\n<p>La disponibilidad de establecimientos, horarios, tipos de café incluidos y demás condiciones particulares podrán variar según cada establecimiento adherido.<\/p>\n<h2>3. Requisitos para utilizar el servicio<\/h2>\n<p>Para utilizar CAFETEANDO debés:<\/p>\n<ul><li>ser mayor de 18 años;<\/li><li>contar con una dirección de correo electrónico válida;<\/li><li>contar con un medio de pago habilitado cuando corresponda;<\/li><li>disponer de una cuenta personal en CAFETEANDO;<\/li><li>encontrarte dentro de las zonas donde CAFETEANDO opere y existan establecimientos adheridos disponibles para realizar canjes.<\/li><\/ul>\n<h2>4. Membresía y pagos<\/h2>\n<p>La membresía de CAFETEANDO tendrá carácter mensual y, salvo que se indique expresamente lo contrario al momento de contratar, se renovará automáticamente.<\/p>\n<p>Los pagos serán procesados mediante <strong>Mercado Pago<\/strong> u otros medios de pago que CAFETEANDO pueda habilitar.<\/p>\n<p>Durante el período beta, CAFETEANDO podrá ofrecer una membresía gratuita durante el período y bajo las condiciones informadas al momento del registro.<\/p>\n<p>Una vez finalizado el período gratuito, comenzará a cobrarse el precio de membresía informado al usuario al momento de la contratación.<\/p>\n<p>CAFETEANDO podrá modificar el precio de la membresía para períodos futuros, informando previamente al usuario conforme a la normativa aplicable.<\/p>\n<h2>5. Reglas de uso del servicio<\/h2>\n<p>El uso de CAFETEANDO está sujeto a las siguientes reglas:<\/p>\n<p><strong>a)<\/strong> Podés canjear un (1) Café de la Membresía por día calendario, desde las 00:00 hasta las 23:59. Los canjes no utilizados no se acumulan ni se trasladan a días posteriores.<\/p>\n<p><strong>b)<\/strong> Podés realizar hasta cuatro (4) canjes por mes calendario en un mismo establecimiento. Esta restricción se reinicia el primer día de cada mes.<\/p>\n<p><strong>c)<\/strong> Cada canje requiere realizar previamente al menos una (1) consumición adicional en el establecimiento, de acuerdo con las condiciones informadas por CAFETEANDO y el establecimiento adherido.<\/p>\n<p><strong>d)<\/strong> Al momento del lanzamiento, los Cafés de la Membresía estarán disponibles exclusivamente para consumo dentro del establecimiento. CAFETEANDO podrá incorporar posteriormente una modalidad Take Away, sujeta a las condiciones que se comuniquen oportunamente y a la adhesión de los establecimientos que participen de dicha modalidad.<\/p>\n<p><strong>e)<\/strong> La membresía es personal e intransferible. Está prohibido compartir la cuenta, código QR o mecanismo de validación con terceros, o utilizar la membresía en beneficio de personas distintas del titular.<\/p>\n<p><strong>f)<\/strong> El usuario deberá respetar las condiciones de funcionamiento y horarios informados por cada establecimiento adherido.<\/p>\n<p><strong>g)<\/strong> CAFETEANDO podrá suspender o cancelar una cuenta cuando existan incumplimientos de estos Términos y Condiciones, uso fraudulento, manipulación del sistema, utilización indebida de códigos o cualquier otra conducta que afecte el funcionamiento del servicio, sin perjuicio de los derechos que pudieran corresponder al usuario conforme a la normativa aplicable.<\/p>\n<h2>6. Cancelación de la membresía<\/h2>\n<p>Podés cancelar tu membresía mediante los mecanismos habilitados por CAFETEANDO.<\/p>\n<p>La cancelación tendrá efecto conforme a las condiciones informadas al momento de la contratación y, cuando corresponda, al finalizar el período de membresía ya abonado.<\/p>\n<p>Salvo que la normativa aplicable establezca lo contrario, la cancelación no generará automáticamente el reintegro proporcional de períodos ya iniciados.<\/p>\n<p>Durante el período beta gratuito, si la cancelación se realiza antes de que comience un período pago, no se efectuará ningún cargo.<\/p>\n<h2>7. Disponibilidad del servicio y de los establecimientos<\/h2>\n<p>CAFETEANDO no garantiza la disponibilidad permanente de todos los establecimientos adheridos.<\/p>\n<p>Los establecimientos podrán incorporarse, modificar sus días u horarios de atención, modificar las condiciones particulares de su Café de la Membresía o retirarse de la red de acuerdo con las condiciones aplicables a cada establecimiento.<\/p>\n<p>CAFETEANDO procurará mantener actualizada la información disponible en la aplicación.<\/p>\n<p>La indisponibilidad temporal de un establecimiento determinado no implica por sí misma la interrupción del servicio general de CAFETEANDO.<\/p>\n<h2>8. Responsabilidad<\/h2>\n<p>CAFETEANDO actúa como plataforma que conecta a los usuarios con establecimientos adheridos.<\/p>\n<p>Cada establecimiento es responsable por los productos que ofrece, su preparación, calidad, higiene, atención al público y las condiciones de funcionamiento de su establecimiento.<\/p>\n<p>CAFETEANDO no será responsable por hechos que se encuentren exclusivamente bajo el control del establecimiento, sin perjuicio de las responsabilidades que legalmente pudieran corresponder.<\/p>\n<p>CAFETEANDO tampoco será responsable por interrupciones o fallas originadas exclusivamente en proveedores tecnológicos o servicios de terceros, como medios de pago, servicios de internet, servicios de hosting u otros proveedores externos, sin perjuicio de las obligaciones que legalmente correspondan.<\/p>\n<p><strong>Ninguna disposición de estos Términos y Condiciones tendrá por objeto excluir o limitar derechos o responsabilidades que no puedan ser legalmente excluidos o limitados.<\/strong><\/p>\n<h2>9. Propiedad intelectual<\/h2>\n<p>El nombre CAFETEANDO, su identidad visual, logotipo, diseño, textos, contenidos, elementos gráficos, software y demás elementos desarrollados para la plataforma pertenecen a CAFETEANDO o son utilizados bajo las correspondientes autorizaciones o licencias.<\/p>\n<p>Queda prohibida su reproducción, modificación, distribución, explotación comercial o utilización fuera de las finalidades permitidas por CAFETEANDO sin autorización previa.<\/p>\n<h2>10. Modificaciones al servicio<\/h2>\n<p>CAFETEANDO podrá realizar modificaciones, actualizaciones y mejoras en la aplicación, funcionalidades, sistemas y aspectos operativos del servicio cuando resulte necesario para su funcionamiento, evolución o mejora.<\/p>\n<p>Cuando una modificación implique un cambio sustancial en las condiciones económicas o esenciales de la membresía, CAFETEANDO procurará comunicarlo previamente y otorgará al usuario las opciones que correspondan conforme a la normativa aplicable.<\/p>\n<p>En caso de discontinuación definitiva del servicio, CAFETEANDO comunicará dicha decisión con una antelación razonable y efectuará, cuando corresponda, los reintegros que legalmente correspondan respecto de períodos abonados y no utilizados.<\/p>\n<h2>11. Ley aplicable y jurisdicción<\/h2>\n<p>Estos Términos y Condiciones se rigen por las leyes de la República Argentina.<\/p>\n<p>En caso de controversias, serán competentes los tribunales que correspondan conforme a la normativa aplicable.<\/p>\n<h2>12. Contacto<\/h2>\n<p>Para consultas relacionadas con estos Términos y Condiciones: <strong><a href=\"mailto:contactocafeteando@gmail.com\">contactocafeteando@gmail.com<\/a><\/strong><\/p>\n<p><strong>CAFETEANDO — Ciudad Autónoma de Buenos Aires, República Argentina.<\/strong><\/p>"}, "privacidad": {"t": "Política de privacidad", "h": "<h2>1. Responsable del tratamiento de datos<\/h2>\n<p>CAFETEANDO, actualmente desarrollado y administrado por Luciana Bauchi, CUIT 27-37805279-9 y Julian Agustín Lopez, CUIT 20-40008482-4, con domicilio en Ciudad Autónoma de Buenos Aires, República Argentina, es responsable del tratamiento de los datos personales recolectados a través de la aplicación CAFETEANDO y de los canales asociados al servicio.<\/p>\n<p>En caso de que CAFETEANDO sea posteriormente transferido, aportado o desarrollado por una sociedad constituida a tal efecto, se actualizará la presente Política de Privacidad para reflejar dicha modificación.<\/p>\n<h2>2. Qué datos recolectamos<\/h2>\n<p>Al registrarte y utilizar CAFETEANDO, podemos recolectar y tratar las siguientes categorías de información:<\/p>\n<ul><li>nombre y apellido;<\/li><li>dirección de correo electrónico;<\/li><li>información necesaria para gestionar tu membresía y suscripción;<\/li><li>información necesaria para gestionar los pagos y la suscripción, procesada a través de <strong>Mercado Pago<\/strong> (unidad de negocios de MercadoLibre S.R.L., CUIT 30-70308853-4), sin que CAFETEANDO almacene los datos completos de las tarjetas de pago en sus propios servidores.<\/li><\/ul>\n<ul><li>historial de canjes realizados, incluyendo cafetería, fecha y horario;<\/li><li>información de ubicación del dispositivo, cuando sea necesaria para determinadas funcionalidades de CAFETEANDO;<\/li><li>información relacionada con el uso de la aplicación, como determinadas interacciones, funcionalidades utilizadas y frecuencia de uso;<\/li><li>información técnica necesaria para el funcionamiento, seguridad y mantenimiento de la aplicación.<\/li><\/ul>\n<p>CAFETEANDO procurará recolectar únicamente aquellos datos que resulten adecuados, pertinentes y necesarios para las finalidades informadas en esta Política.<\/p>\n<p>Los datos necesarios para crear y administrar la cuenta, gestionar la membresía, procesar pagos y realizar los canjes serán necesarios para prestar el servicio. La negativa a proporcionar dichos datos podrá impedir la creación de la cuenta, la contratación de la membresía o el uso de determinadas funcionalidades. Los datos utilizados para funcionalidades opcionales, como la ubicación, serán solicitados únicamente cuando corresponda y podrán no ser proporcionados, sin perjuicio de que ello pueda limitar las funcionalidades que dependan de dicha información.<\/p>\n<h2>3. Para qué usamos tus datos<\/h2>\n<p>Utilizamos los datos personales recolectados para las siguientes finalidades:<\/p>\n<ul><li>gestionar tu registro, cuenta y membresía;<\/li><li>administrar el acceso a la red de establecimientos adheridos;<\/li><li>procesar y validar los canjes correspondientes al servicio;<\/li><li>verificar, cuando corresponda, que el usuario se encuentre habilitado para realizar un canje;<\/li><li>utilizar la ubicación del dispositivo, cuando esta función se encuentre habilitada y resulte necesaria, para mostrar establecimientos cercanos y/o facilitar determinadas funcionalidades de validación y funcionamiento de CAFETEANDO;<\/li><li>enviar comunicaciones necesarias relacionadas con el servicio, incluyendo información sobre la membresía, canjes, funcionamiento de la aplicación, modificaciones relevantes y novedades operativas;<\/li><li>prevenir, detectar y gestionar usos indebidos, fraudes o incumplimientos de las condiciones de uso;<\/li><li>generar estadísticas, métricas y reportes agregados o anonimizados sobre el funcionamiento y utilización de CAFETEANDO;<\/li><li>analizar y mejorar la aplicación, la experiencia de los usuarios y el funcionamiento de la red;<\/li><li>cumplir con obligaciones legales o requerimientos de autoridades competentes.<\/li><\/ul>\n<p>La ubicación del dispositivo será utilizada únicamente cuando resulte necesaria para funcionalidades que requieran información de proximidad o ubicación.<\/p>\n<p><strong>CAFETEANDO no utilizará la ubicación del usuario para fines publicitarios ni realizará un seguimiento permanente de sus desplazamientos.<\/strong><\/p>\n<p>Cuando una funcionalidad de la aplicación no requiera información de ubicación, dicha información no será utilizada para esa funcionalidad.<\/p>\n<h2>4. Con quién compartimos tus datos<\/h2>\n<p>CAFETEANDO no vende ni comercializa los datos personales de sus usuarios.<\/p>\n<p>Podemos compartir información con proveedores y terceros cuando resulte necesario para prestar y administrar el servicio, incluyendo:<\/p>\n<ul><li><strong>Mercado Pago<\/strong> (unidad de negocios de MercadoLibre S.R.L., CUIT 30-70308853-4), como proveedor de servicios de procesamiento de pagos y gestión de las operaciones asociadas a la membresía;<\/li><li><strong>Supabase<\/strong> u otros proveedores de infraestructura tecnológica que CAFETEANDO utilice para almacenar y procesar información necesaria para el funcionamiento del servicio;<\/li><li>proveedores tecnológicos, de hosting, comunicaciones, analítica o servicios relacionados con el funcionamiento de la aplicación, cuando corresponda.<\/li><\/ul>\n<p>Los establecimientos adheridos podrán recibir o visualizar únicamente la información que resulte necesaria para la operación del servicio y la validación de los canjes.<\/p>\n<p><strong>Los establecimientos adheridos no tendrán acceso a la base de datos de usuarios de CAFETEANDO ni a los datos de contacto de los usuarios por el solo hecho de formar parte de la red.<\/strong><\/p>\n<p>Cuando corresponda, CAFETEANDO podrá utilizar y compartir información agregada o anonimizada con fines estadísticos, comerciales o de análisis del funcionamiento del programa, procurando que dicha información no permita identificar individualmente a los usuarios.<\/p>\n<h2>5. Almacenamiento y seguridad<\/h2>\n<p>Los datos personales podrán almacenarse y procesarse mediante servicios de infraestructura tecnológica utilizados por CAFETEANDO, incluyendo <strong>Supabase<\/strong> y otros proveedores que eventualmente sean incorporados.<\/p>\n<p>CAFETEANDO implementará medidas técnicas y organizativas razonables destinadas a proteger los datos personales contra accesos no autorizados, pérdida, alteración, divulgación o utilización indebida.<\/p>\n<p>La información relacionada con los medios de pago será procesada mediante <strong>Mercado Pago<\/strong> y los sistemas de pago que correspondan. CAFETEANDO no almacenará los datos completos de las tarjetas de pago en sus propios servidores.<\/p>\n<p>Cuando determinados proveedores tecnológicos almacenen o procesen información fuera de la República Argentina, CAFETEANDO procurará adoptar las medidas y mecanismos que correspondan de acuerdo con la normativa aplicable.<\/p>\n<h2>6. Tus derechos<\/h2>\n<p>De acuerdo con la normativa argentina aplicable en materia de protección de datos personales, tenés derecho a solicitar información sobre los datos personales que CAFETEANDO posee sobre vos, así como su acceso, actualización, rectificación o supresión cuando corresponda.<\/p>\n<p>También podrás solicitar información sobre la finalidad del tratamiento y, cuando corresponda, oponerte a determinados tratamientos.<\/p>\n<p>Para ejercer tus derechos, podés comunicarte a: <strong><a href=\"mailto:contactocafeteando@gmail.com\">contactocafeteando@gmail.com<\/a><\/strong><\/p>\n<p>CAFETEANDO responderá las solicitudes dentro de los plazos establecidos por la normativa aplicable.<\/p>\n<p>La <strong>Agencia de Acceso a la Información Pública (AAIP)<\/strong> es el organismo de control en materia de protección de datos personales en la República Argentina. En caso de considerar que tus derechos no fueron debidamente atendidos, podrás recurrir ante dicho organismo conforme a los mecanismos previstos por la normativa vigente.<\/p>\n<h2>7. Conservación de los datos<\/h2>\n<p>CAFETEANDO conservará los datos personales durante el tiempo que resulte necesario para prestar el servicio, administrar la membresía, cumplir con las finalidades informadas y atender las obligaciones legales correspondientes.<\/p>\n<p>Cuando los datos ya no resulten necesarios para dichas finalidades, serán eliminados, anonimizados o conservados únicamente cuando exista una obligación legal que justifique su conservación.<\/p>\n<p>Por este motivo, <strong>no establecemos un plazo rígido de eliminación de todos los datos<\/strong>, ya que determinados registros —por ejemplo, información necesaria para acreditar operaciones, pagos o cumplimiento de obligaciones legales— podrían requerir una conservación durante un período determinado.<\/p>\n<h2>8. Cookies y tecnologías similares<\/h2>\n<p>La aplicación y los sitios asociados a CAFETEANDO podrán utilizar cookies, identificadores de sesión, almacenamiento local y otras tecnologías similares necesarias para mantener sesiones, mejorar el funcionamiento de la aplicación, analizar su utilización y brindar determinadas funcionalidades.<\/p>\n<p>CAFETEANDO no utilizará cookies o tecnologías similares de terceros con fines de publicidad personalizada, salvo que dicha modalidad sea incorporada posteriormente y sea informada de acuerdo con la normativa aplicable.<\/p>\n<h2>9. Cambios en esta Política de Privacidad<\/h2>\n<p>CAFETEANDO podrá actualizar esta Política de Privacidad cuando resulte necesario debido a cambios en el servicio, funcionalidades de la aplicación, proveedores tecnológicos, normativa aplicable u otras circunstancias relevantes.<\/p>\n<p>Cuando una modificación resulte sustancial, CAFETEANDO procurará comunicarla a los usuarios mediante los canales disponibles y, cuando corresponda, solicitará nuevamente los consentimientos necesarios.<\/p>\n<p>La versión vigente de esta Política de Privacidad estará disponible dentro de la aplicación y/o en los canales oficiales de CAFETEANDO.<\/p>\n<h2>10. Contacto<\/h2>\n<p>Para consultas relacionadas con esta Política de Privacidad, el tratamiento de datos personales o el ejercicio de derechos:<\/p>\n<p><strong><a href=\"mailto:contactocafeteando@gmail.com\">contactocafeteando@gmail.com<\/a><\/strong><\/p>\n<p><strong>CAFETEANDO — Ciudad Autónoma de Buenos Aires, República Argentina.<\/strong><\/p>"}};

<script>
/* Capa de datos del portal.
   - mode 'mock': no hace nada (la maqueta usa datos de ejemplo en memoria).
   - mode 'supabase': conecta la AUTENTICACIÓN real (registro, ingreso, recuperación) con Supabase Auth.
   Etapa 1: solo acceso. Los datos del panel siguen siendo de ejemplo hasta conectar la etapa 2. */
const PCFG = window.PORTAL_CONFIG || { mode: 'mock' };

const api = (() => {
  const live = PCFG.mode === 'supabase';
  let client = null;
  let lastSession = null;

  // URL a la que vuelven los links de los mails (tiene que estar en la lista de redirecciones permitidas de Supabase).
  const siteUrl = () => PCFG.siteUrl || (location.origin !== 'null' ? location.origin + location.pathname : '');

  const MSG_SOCIO = 'Esta cuenta es de la app de Cafeteando (socio). Para tu comercio creá una cuenta nueva con otro email.';

  const errMsg = (e) => {
    const c = (e && (e.code || e.error_code)) || '';
    const m = ((e && e.message) || '').toLowerCase();
    if (c === 'invalid_credentials' || m.includes('invalid login')) return 'Email o contraseña incorrectos.';
    if (c === 'email_not_confirmed' || m.includes('not confirmed')) return 'EMAIL_NOT_CONFIRMED';
    if (c === 'over_request_rate_limit' || c === 'over_email_send_rate_limit' || (e && e.status === 429))
      return 'Hiciste muchos intentos. Podés esperar unos minutos y probar de nuevo.';
    if (c === 'weak_password' || m.includes('pwned') || m.includes('compromised') || (m.includes('password') && m.includes('weak')))
      return 'Esa contraseña es muy débil o apareció en filtraciones. ¿Probás con otra?';
    if (c === 'same_password' || m.includes('different from the old')) return 'La contraseña nueva tiene que ser distinta a la anterior.';
    if (m.includes('fetch') || m.includes('network')) return 'No pudimos conectar. ¿Revisás tu conexión y probamos de nuevo?';
    return 'No pudimos completar la acción. ¿Probamos de nuevo en un momento?';
  };

  const loadLib = () => new Promise((res, rej) => {
    if (window.supabase && window.supabase.createClient) return res();
    const s = document.createElement('script');
    s.src = PCFG.supabaseLibUrl || 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = res;
    s.onerror = () => rej(new Error('network'));
    document.head.append(s);
  });

  const isMerchant = (u) => !!u && !!u.user_metadata && u.user_metadata.account_type === 'merchant';

  return {
    live,
    _client: () => client,
    isMerchant,
    errMsg,
    MSG_SOCIO,

    async init(onEvent) {
      if (!live) return null;
      await loadLib();
      client = window.supabase.createClient(PCFG.supabaseUrl, PCFG.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });
      client.auth.onAuthStateChange((ev, sess) => {
        lastSession = sess || null;
        onEvent && onEvent(ev, sess);
      });
      const { data } = await client.auth.getSession();
      lastSession = (data && data.session) || null;
      return lastSession;
    },

    session: () => lastSession,
    user: () => (lastSession && lastSession.user) || null,

    async signUp({ email, password, businessName }) {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: siteUrl(),
          data: { account_type: 'merchant', business_name: businessName },
        },
      });
      if (error) {
        // Si el email ya existe, no lo revelamos: se muestra igual "revisá tu correo".
        if (error.code === 'user_already_exists' || /already/i.test(error.message || '')) return { ok: true, needsVerify: true };
        return { ok: false, error: errMsg(error) };
      }
      return { ok: true, needsVerify: !(data && data.session) };
    },

    async signIn(email, password) {
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        const m = errMsg(error);
        if (m === 'EMAIL_NOT_CONFIRMED') return { ok: false, notConfirmed: true };
        return { ok: false, error: m };
      }
      if (!isMerchant(data.user) && !(await this.isAdmin())) {
        await client.auth.signOut();
        return { ok: false, error: MSG_SOCIO };
      }
      return { ok: true };
    },

    async signOut() { try { await client.auth.signOut(); } catch (e) { /* sin conexión: igual se limpia la sesión local */ } lastSession = null; },

    async resetRequest(email) {
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: siteUrl() });
      // No revelamos si el email existe: solo informamos errores de límite o de red.
      if (error && (error.status === 429 || /fetch|network|rate/i.test(error.message || ''))) return { ok: false, error: errMsg(error) };
      return { ok: true };
    },

    async updatePassword(password) {
      const { error } = await client.auth.updateUser({ password });
      return error ? { ok: false, error: errMsg(error) } : { ok: true };
    },

    async saveOnboarding(merchant, payload, newBranch) {
      const { data, error } = await client.rpc('save_onboarding', { p_merchant: merchant, p_payload: payload, p_new_branch: !!newBranch });
      return error ? { ok: false, error: errMsg(error) } : { ok: true, id: data };
    },

    async listRequests() {
      try {
        const { data, error } = await client.from('cafe_requests')
          .select('id,merchant_id,status,kind,cafe_id,payload,review_note,submitted_at,created_at,merchants(contact_name,role,phone,contact_email)')
          .neq('status', 'draft').order('submitted_at', { ascending: false });
        return error ? { ok: false, error: errMsg(error) } : { ok: true, rows: data || [] };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async decideRequest(id, decision, note) {
      try {
        const { error } = await client.rpc('admin_decide_request', { p_request_id: id, p_decision: decision, p_note: note });
        return error ? { ok: false, error: /NOT_PENDING/.test(error.message) ? 'Esa solicitud ya no está pendiente.' : errMsg(error) } : { ok: true };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async loadMine() {
      try {
        const m = await client.from('merchants').select('*').maybeSingle();
        if (m.error) return { ok: false, error: errMsg(m.error) };
        if (!m.data) return { ok: true, merchant: null, request: null };
        const q = await client.from('cafe_requests').select('*').eq('merchant_id', m.data.id)
          .eq('kind', 'new_local').order('created_at', { ascending: true }).limit(1).maybeSingle();
        return { ok: true, merchant: m.data, request: q.data || null };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async uploadMedia(file, merchantId) {
      try {
        const ext = ({ 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' })[file.type] || 'jpg';
        const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
        const path = merchantId + '/' + id + '.' + ext;
        const up = await client.storage.from('cafe-media').upload(path, file, { contentType: file.type, upsert: false });
        if (up.error) return { ok: false, error: 'No pudimos subir la imagen. Probá de nuevo.' };
        const { data } = client.storage.from('cafe-media').getPublicUrl(path);
        return { ok: true, url: data.publicUrl };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async submitRequest(id) {
      try {
        const { error } = await client.rpc('submit_request', { p_request_id: id });
        if (!error) return { ok: true };
        const m = error.message || '';
        if (/INCOMPLETE/.test(m)) return { ok: false, incomplete: m.split('INCOMPLETE:')[1].trim().split(',') };
        return { ok: false, error: errMsg(error) };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async approveRequest(id, lat, lng) {
      try {
        const { data, error } = await client.rpc('admin_approve_request', { p_request_id: id, p_lat: lat, p_lng: lng });
        if (!error) return { ok: true, code: data };
        const m = error.message || '';
        if (/COORDS_REQUIRED/.test(m)) return { ok: false, error: 'Faltan las coordenadas del local.' };
        if (/NOT_PENDING/.test(m)) return { ok: false, error: 'Esa solicitud ya no está pendiente.' };
        return { ok: false, error: errMsg(error) };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async setCafeActive(id, active) {
      try {
        const { error } = await client.rpc('admin_set_cafe_active', { p_request_id: id, p_active: !!active });
        return error ? { ok: false, error: /NOT_APPROVED/.test(error.message || '') ? 'Ese local todavía no está aprobado.' : errMsg(error) } : { ok: true };
      } catch (e) { return { ok: false, error: errMsg(e) }; }
    },

    async myCafeInfo() {
      try { const { data, error } = await client.rpc('my_cafe_info'); return error ? {} : (data || {}); } catch (e) { return {}; }
    },

    async getEmailPrefs() {
      try { const { data } = await client.from('merchants').select('email_prefs').maybeSingle(); return (data && data.email_prefs) || {}; } catch (e) { return {}; }
    },

    async setEmailPref(key, value) {
      try { const { error } = await client.rpc('set_email_pref', { p_key: key, p_value: !!value }); return !error; } catch (e) { return false; }
    },

    async myStats() {
      try { const { data, error } = await client.rpc('my_cafe_stats'); return error ? {} : (data || {}); } catch (e) { return {}; }
    },

    async listAcceptances() {
      try { const { data, error } = await client.from('portal_contract_acceptances').select('merchant_id,version,accepted_at').order('accepted_at', { ascending: false }); return error ? [] : (data || []); } catch (e) { return []; }
    },

    async isAdmin() {
      try { const { data, error } = await client.rpc('is_admin'); return !error && data === true; } catch (e) { return false; }
    },

    async resend(email) {
      const { error } = await client.auth.resend({ type: 'signup', email, options: { emailRedirectTo: siteUrl() } });
      return error ? { ok: false, error: errMsg(error) } : { ok: true };
    },
  };
})();

function authError(msg) {
  const f = document.querySelector('[data-authform]');
  if (!f) { toast(msg); return; }
  let b = f.querySelector('#err-auth');
  if (!b) {
    b = document.createElement('div');
    b.id = 'err-auth'; b.className = 'ferr'; b.setAttribute('role', 'alert');
    b.style.cssText = 'margin:10px 0';
    const btn = f.querySelector('button[type=submit]');
    (btn ? btn.parentNode : f).insertBefore(b, btn || null);
  }
  b.textContent = msg || '';
}
function authBusy(btn, on) { if (btn) { btn.disabled = on; btn.style.opacity = on ? '.6' : ''; } }

// Arranque en modo supabase: restaura la sesión y detecta errores en el link (por ejemplo, vencido).
function liveBoot(session) {
  const h = (location.hash || '') + '&' + (location.search || '');
  if (/error_code=otp_expired|error=access_denied/.test(h)) { view = 'expired'; render(); return; }
  if (/type=recovery/.test(h)) return; // lo maneja PASSWORD_RECOVERY
  if (session) {
    (async () => {
      let adm = false; try { adm = await api.isAdmin(); } catch (e) { /* sin permiso */ }
      if (api.isMerchant(session.user) || adm) liveAfterLogin(/type=signup|type=email/.test(h));
      else { await api.signOut(); view = 'auth'; render(); }
    })();
  }
}

// Horario legible: agrupa días consecutivos con el mismo horario.
function liveFmtSched(s) {
  if (!Array.isArray(s) || s.length !== 7) return '—';
  const N = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const h = (t) => String(t || '').replace(/^0/, '');
  const key = (d) => (d && d.on && d.r && d.r[0]) ? h(d.r[0][0]) + '–' + h(d.r[0][1]) : 'cerrado';
  const out = []; let i = 0;
  while (i < 7) { let j = i; while (j + 1 < 7 && key(s[j + 1]) === key(s[i])) j++; out.push((j > i ? N[i] + ' a ' + N[j] : N[i]) + ' ' + key(s[i])); i = j + 1; }
  return out.join(' · ');
}

// Carga lo guardado en Supabase y decide a qué pantalla ir.
async function liveHydrate() {
  liveCleanState();
  const r = await api.loadMine();
  if (!r.ok) { toast(r.error); return 'error'; }
  const m = r.merchant, q = r.request;
  if (!m || !q) { FD.ob_name = FD.r_name || ''; view = 'onb'; ob = 0; addrSel = null; addrText = ''; delete FD.ad_b; delete FD.ad_prov; mview = 'inicio'; return 'onb'; }
  liveMerchantId = m.id; liveReqId = q.id;
  const p = q.payload || {};
  FD.ob_titular = m.contact_name || ''; FD.ob_wsp = m.phone || ''; FD.ob_mail = m.contact_email || '';
  FD.ob_rs = m.legal_name || ''; FD.ob_cuit = m.cuit || ''; FD.ob_social = m.instagram || ''; FD.ob_how = m.how_found || '';
  const ROLES_L = ['Dueño/a', 'Socio/a', 'Encargado/a', 'Empleado/a'];
  FD.ob_rol = ROLES_L.includes(m.role) ? m.role : (m.role ? 'Otro' : ''); FD.ob_rol_otro = ROLES_L.includes(m.role) ? '' : (m.role || '');
  liveApplyPayload(p);
  const S = { draft: 'borrador', pending: 'pendiente', needs_fix: 'correccion', approved: 'aprobado', rejected: 'correccion' };
  status = S[q.status] || 'borrador';
  if (q.submitted_at) { const d = new Date(q.submitted_at); window.__subDate = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
  if (q.review_note) corrMsg = q.review_note;
  if (m.contact_name && !p.address) { view = 'onb'; ob = 1; mview = 'inicio'; return 'onb'; }
  if (status === 'aprobado') {
    window.__stats = await api.myStats(); const ci = await api.myCafeInfo(); liveCafe = { code: ci.code || '', active: !!ci.active, enabled: !!ci.enabled };
    if (ci.code) locals[0].code = ci.code;
    onMap = !!ci.active; cooldownUntil = ci.last_toggle_at ? new Date(ci.last_toggle_at).getTime() + 300000 : 0;
    const pc = await api.myPendingChange();
    if (pc.ok && pc.data && Object.keys(pc.data).length) {
      liveApplyPayload(Object.assign({}, p, pc.data));
      chg.desc = Object.keys(pc.data).some((k) => ['name', 'description', 'address', 'neighborhood', 'maps_url', 'services', 'other_services'].includes(k));
      chg.fotos = Object.keys(pc.data).some((k) => ['photos', 'logo_url'].includes(k));
    }
  }
  view = { borrador: 'm-nuevo', pendiente: 'm-pend', correccion: 'm-corr', aprobado: 'm-ok' }[status];
  mview = 'inicio';
  return view;
}

function liveApplyPayload(p) {
  FD.ob_name = p.name || ''; FD.ob_maps = p.maps_url || '';
  if (p.lat != null && p.lng != null) { pin.lat = +p.lat; pin.lng = +p.lng; pin.moved = false; } else { pin = { x: 52, y: 46 }; }
  FD.cf_name = p.name || ''; FD.cf_desc = p.description || ''; FD.cf_otros = p.other_services || '';
  if (p.address) { addrSel = { a: p.address, b: p.neighborhood || '' }; FD.ad_b = p.neighborhood || ''; FD.ad_prov = p.province || ''; locals[0].addr = p.address; locals[0].barrio = p.neighborhood || ''; }
  else { addrSel = null; delete FD.ad_b; delete FD.ad_prov; }
  svc = new Set((p.services || []).map((s) => VAR.indexOf(s)).filter((i) => i >= 0));
  if (p.logo_url) logo = { n: 'logo', u: p.logo_url, url: p.logo_url };
  photos = (p.photos || []).map((u, i) => ({ n: 'Foto ' + (i + 1), u, url: u }));
  if (Array.isArray(p.schedule) && p.schedule.length === 7) sched = p.schedule;
  if (p.daily_stock) cupo = p.daily_stock;
  extra.items = Array.isArray(p.benefits) ? p.benefits.map((b) => ({ text: ((b.text || '') + (b.cond ? ' (' + b.cond + ')' : '')).trim(), cond: '' })) : [];
  extra.pub = extra.items.map((x) => x.text);
  contractOk = !!p.contract_version_accepted;
  doneCafe = !!(p.name && p.logo_url && photos.length >= 3 && (svc.size || p.other_services));
  doneDisp = !!(p.schedule && p.daily_stock >= 5);
}

function liveBuildPayload() {
  const payload = {
    description: (FD.cf_desc || '').trim(), other_services: (FD.cf_otros || '').trim(),
    services: [...svc].sort((x, y) => x - y).map((i) => VAR[i]), schedule: sched, daily_stock: cupo,
    photos: photos.map((x) => x.url).filter(Boolean),
    benefits: extra.items.filter((x) => (x.text || '').trim()).map((x) => ({ text: x.text.trim(), cond: '' })),
  };
  if (FD.cf_name !== undefined && FD.cf_name.trim()) payload.name = FD.cf_name.trim();
  if (addrSel) { payload.address = addrSel.a; payload.neighborhood = curBarrio(); if (FD.ad_prov) payload.province = FD.ad_prov; }
  if (pin.lat && (status !== 'aprobado' || pin.moved)) { payload.lat = +pin.lat.toFixed(7); payload.lng = +pin.lng.toFixed(7); }
  if (logo && logo.url) payload.logo_url = logo.url;
  if (contractOk) payload.contract_version_accepted = accV;
  return payload;
}

    status = 'pendiente'; view = 'm-pend'; mview = 'inicio'; render();

}

// Admin: aprobar y publicar (el local queda INACTIVO hasta que se active para el lanzamiento).
function parseCoords(t) {
  const s = (t || '').trim();
  let m = s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) || s.match(/(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  return lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 ? { lat, lng } : null;
}
// Geocodificación automática (OpenStreetMap / Nominatim). El admin siempre puede corregir el valor.
async function liveGeocode(r) {
  if (r.pinLat != null && r.pinLng != null) return { lat: r.pinLat, lng: r.pinLng, label: 'ubicación confirmada por el local en el mapa' };
  const fromMaps = parseCoords(r.maps || '');
  if (fromMaps) return { lat: fromMaps.lat, lng: fromMaps.lng, label: 'tomado del link de Google Maps del local' };
  const tries = [
    [r.dir, r.b !== '—' ? r.b : '', r.prov, 'Argentina'],
    [r.dir, r.prov, 'Argentina'],
  ];
  for (const parts of tries) {
    const q = parts.filter(Boolean).join(', ');
    if (!q) continue;
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ar&accept-language=es&q=' + encodeURIComponent(q));
      if (!res.ok) continue;
      const a = await res.json();
      if (a && a[0]) return { lat: +(+a[0].lat).toFixed(7), lng: +(+a[0].lon).toFixed(7), label: a[0].display_name };
    } catch (e) { /* sin red o bloqueado: queda manual */ }
  }
  return null;
}
function liveApprove(r) {
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:#2b1d1699;z-index:90;display:grid;place-items:center;padding:16px';
  m.innerHTML = `<div class="card" style="max-width:480px;width:100%;margin:0"><h2>Aprobar y publicar: ${esc(r.n)}</h2>
  <p class="muted" style="margin:6px 0 14px">Se crea el local con su código de canje de 5 dígitos. Queda <b>inactivo</b>: no aparece en la app hasta que lo actives.</p>
  <div class="field"><label for="ap_c">Ubicación en el mapa <span class="req" aria-hidden="true">*</span></label>
  <input id="ap_c" placeholder="Buscando la ubicación de ${esc(r.dir)}…" value="${esc(r.maps || '')}">
  <div class="hint" id="ap_h">Buscando la ubicación automáticamente…</div><div class="ferr" id="ap_e" role="alert"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="ap_x">Cancelar</button><button class="btn ok" id="ap_ok">Aprobar</button></div></div>`;
  document.body.append(m);
  m.querySelector('#ap_x').onclick = () => m.remove();
  const inp = m.querySelector('#ap_c'), hint = m.querySelector('#ap_h');
  liveGeocode(r).then((g) => {
    if (!m.isConnected) return;
    if (g) {
      if (!inp.value.trim() || !parseCoords(inp.value)) inp.value = g.lat + ', ' + g.lng;
      hint.innerHTML = 'Ubicación encontrada automáticamente (' + esc(g.label) + '). <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + g.lat + ',' + g.lng + '">Verificar en Google Maps</a>. Si no es correcta, pegá otras coordenadas o un link de Google Maps.';
    } else {
      inp.placeholder = "Pegá el link de Google Maps o 'lat, lng' (ej: -34.5875, -58.4210)";
      hint.textContent = 'No pudimos ubicar la dirección (' + r.dir + ') automáticamente. Abrila en Google Maps y pegá el link o las coordenadas.';
    }
  });
  m.querySelector('#ap_ok').onclick = async () => {
    const c = parseCoords(inp.value);
    if (!c) { m.querySelector('#ap_e').textContent = 'No pudimos leer las coordenadas. Pegá "lat, lng" o un link de Google Maps con @lat,lng.'; return; }
    const b = m.querySelector('#ap_ok'); b.disabled = true;
    const x = await api.approveRequest(r.id, c.lat, c.lng);
    if (!x.ok) { b.disabled = false; m.querySelector('#ap_e').textContent = x.error; return; }
    m.remove(); await liveLoadRequests(); render();
    toast('Aprobado. Código de canje: ' + x.code + ' (el local queda inactivo hasta activarlo).');
  };
}

async function liveSetActive(r, active) {
  const x = await api.setCafeActive(r.id, active);
  if (!x.ok) { toast(x.error); return; }
  toast(active ? 'Listo: el local ya figura en la app.' : 'Listo: el local dejó de figurar en la app.');
}

function schedModal(){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:#2b1d1699;z-index:90;display:grid;place-items:center;padding:16px';m.innerHTML=`<div class="card" style="max-width:440px;width:100%;margin:0"><h2>Programar una pausa</h2><p class="muted" style="margin:6px 0 14px">Tu local se pausa solo en esas fechas y se reactiva automáticamente al terminar. No hace falta que lo hagas a mano.</p><div class="grid g2"><div class="field"><label>Desde *</label><input type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-date id="sd"></div><div class="field"><label>Hasta *</label><input type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" data-date id="sh"></div></div><div class="field"><label>Motivo</label><select id="sr"><option>Vacaciones</option><option>Fuerza mayor</option><option>Refacciones / obra</option><option>Otro</option></select></div><p class="err" id="se" style="display:none;margin-bottom:10px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="sc">Cancelar</button><button class="btn" id="sk">Programar</button></div></div>`;document.body.append(m);mountModal(m);m.querySelector('#sc').onclick=()=>m.remove();m.querySelector('#sk').onclick=()=>{const d=dIso(m.querySelector('#sd').value),h=dIso(m.querySelector('#sh').value),e=m.querySelector('#se');if(!d||!h||h<d){e.style.display='block';e.textContent=!d||!h?'Necesitamos las dos fechas en formato dd/mm/aaaa.':'La fecha final debe ser igual o posterior a la inicial.';return}const f=v=>v.split('-').reverse().slice(0,2).join('/');schedPause={from:f(d),to:f(h),reason:m.querySelector('#sr').value.toLowerCase()};m.remove();render();toast('Pausa programada. Te enviamos un email de confirmación (simulado)')}}

(Texto de ejemplo: se reemplaza por el contrato real en PDF.)

 <div style="margin-top:14px"><div style="display:flex;justify-content:space-between"><span class="muted">Aceptaron la versión ${lc.v}</span><b>${lc.acc} de 38 comercios</b></div><div class="bar"><i style="width:${Math.round(lc.acc/38*100)}%"></i></div>

<script>

:`<h2 style="font-size:24px">Recuperar contraseña</h2><p class="muted" style="margin:8px 0 16px">Escribí el email de tu cuenta y te enviamos un link para crear una contraseña nueva.</p><form novalidate data-authform onsubmit="return false">${fld({id:'fp_mail',label:'Email',rules:'req,email',type:'email',ph:'tu@cafeteria.com',ac:'email'})}<button type="submit" class="btn" style="width:100%" data-fpsend>Enviar link</button></form><p class="hint" style="margin-top:16px;text-align:center"><a href="#" data-tologin>Volver a iniciar sesión</a></p>`)}
