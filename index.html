// Mapa real (OpenStreetMap + Leaflet): el pin se ve sobre la calle y se puede arrastrar.
function realMap(){const box=document.querySelector('[data-map-area]');if(!box||typeof LF==='undefined'||box.dataset.real)return;box.dataset.real='1';
 const old=box.querySelector('[data-pin]');if(old)old.remove();box.style.background='none';box.style.height='260px';
 const map=LF.map(box,{zoomControl:true,scrollWheelZoom:false}).setView(pin.lat?[pin.lat,pin.lng]:[-34.6037,-58.3816],pin.lat?17:12);
 LF.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 const hp=box.parentNode&&box.parentNode.querySelector('.hint');let nt=document.getElementById('pin_note');if(!nt&&hp){nt=document.createElement('p');nt.id='pin_note';nt.className='hint';nt.style.cssText='margin-top:4px;color:var(--terracota)';hp.after(nt)}
 const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
 const note=()=>{if(!nt)return;const d=pin.orig&&pin.lat?dist(pin.orig,pin):0;nt.textContent=d>150?'El pin quedó a unos '+Math.round(d/10)*10+' m de la dirección que elegiste. Si tu local está ahí, está todo bien; si no, acercalo a la dirección.':''};
 if(hp)hp.textContent='¿Confirmás que el pin está sobre tu local? Podés arrastrarlo o tocar el mapa para ajustarlo. La provincia y el barrio se completan solos según la dirección que elegiste.';
 if(addrSel&&addrSel.fromCand){const t='Se completó según la dirección elegida. Para cambiarlo, buscá otra dirección.';const pe=document.getElementById('ad_prov');if(pe){pe.disabled=true;pe.title=t}const be=document.getElementById('ad_b');if(be&&be.value){if(be.tagName==='SELECT')be.disabled=true;else be.readOnly=true;be.title=t}}
 const mk=LF.marker(map.getCenter(),{draggable:true}).addTo(map);
 mk.on('dragend',()=>{const c=mk.getLatLng();pin.lat=c.lat;pin.lng=c.lng;pin.moved=true;note()});
 map.on('click',e=>{mk.setLatLng(e.latlng);pin.lat=e.latlng.lat;pin.lng=e.latlng.lng;pin.moved=true;note()});
 const norm=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 const run=async q=>{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&countrycodes=ar&accept-language=es&q='+encodeURIComponent(q));const a=await r.json();return a&&a[0]};
 const fill=a=>{const x=admFrom(a);const ch=(x.prov&&FD.ad_prov!==x.prov)||FD.ad_b!==x.b;if(x.prov)FD.ad_prov=x.prov;FD.ad_b=x.b;if(addrSel)addrSel.b=x.b;if(ch)render()};
 const place=async(manual)=>{const val=id=>{const e=document.getElementById(id);return e?e.value:''};const auto=!manual&&!!(addrSel&&addrSel.custom);
  const q=[addrSel&&addrSel.a,val('ad_b'),val('ad_prov'),'Argentina'].filter(Boolean).join(', ');
  try{let a=await run(q);if(!a&&auto)a=await run((addrSel.a||'')+', Argentina');
   if(a){pin.lat=+a.lat;pin.lng=+a.lon;pin.orig={lat:pin.lat,lng:pin.lng};if(auto)pin.moved=true;mk.setLatLng([pin.lat,pin.lng]);map.setView([pin.lat,pin.lng],17);if(auto)fill(a)}}catch(e){}};
 if(pin.lat){mk.setLatLng([pin.lat,pin.lng])}else place();

 setTimeout(()=>map.invalidateSize(),200)}

    catch (e) { return { ok: false, error: rpcErr(e) }; }

      const j = await r.json().catch(() => ({}));
      return j && typeof j === 'object' ? j : { ok: false, error: 'SERVER' };
    } catch (e) { return { ok: false, error: 'NETWORK' }; }
  },
  adminSummary: () => api._rpc('admin_summary'),
  adminTeam: () => api._rpc('admin_team'),
  adminChangeCurrent: () => api._rpc('admin_change_current', {}),

function liveInvit() {
  const C = (LIVE_ADMIN.cafes || []).slice();
  const rank = (c) => (c.claimed ? 0 : c.invite ? 1 : 2);
  C.sort((x, y) => rank(x) - rank(y) || String(x.name).localeCompare(String(y.name)));
  const reqOf = (c) => REQ.find((r) => r.cafeId === c.id && r.s === 'aprobado' && !r.chg) || REQ.find((r) => r.cafeId === c.id && !r.chg);

  <div id="main" role="main" tabindex="-1" style="max-width:760px;margin:0 auto;padding:30px 18px 60px">
  <h1 style="text-align:center">¡Tu local fue aprobado!</h1>
  <p class="muted" style="margin:10px 0 22px;text-align:center"><b style="color:var(--ink)">${esc(bizName())}</b> ya está listo para sumarse a Cafeteando. Solo falta un último paso: leé las condiciones del servicio y confirmalas con tu nombre. Apenas lo hagas, tu local queda <b>activo</b> y acá mismo te mostramos tu <b>código de canje</b>.</p>

  <div class="grid g2" style="margin-top:10px"><div class="field"><label for="sg_name">Nombre y apellido</label><input id="sg_name" value="${esc(sgName)}" autocomplete="off" placeholder="Nombre y apellido"></div>
  <div class="field"><label for="sg_role">¿Qué rol tenés en el local?</label><select id="sg_role"><option value="">Elegí una opción</option>${roles.map((r) => `<option ${r === sgRole ? 'selected' : ''}>${r}</option>`).join('')}</select></div></div>
  <label style="font-weight:400;display:flex;gap:8px;margin:12px 0"><input type="checkbox" style="width:auto" id="sg_chk" ${sgChk ? 'checked' : ''}> Leí las condiciones y las acepto en nombre del local.</label>
  <p class="hint">Guardamos la fecha, la hora y la versión de las condiciones, y te mandamos un comprobante por email.</p>
  <button class="btn" style="width:100%;margin-top:12px;${ok ? '' : 'opacity:.4;cursor:not-allowed'}" data-sign ${ok ? '' : 'disabled'}>${sgBusy ? 'Procesando…' : 'Aceptar y activar mi local'}</button></div></div>`;

function sgBind() {
  const n = document.getElementById('sg_name'), r = document.getElementById('sg_role'), c = document.getElementById('sg_chk'), b = document.querySelector('[data-sign]');
  if (!n || !b) return;
  const upd = () => { sgName = n.value; sgRole = r.value; sgChk = c.checked; const ok = /\S+\s+\S+/.test(sgName.trim()) && sgRole && sgChk; b.disabled = !ok; b.style.opacity = ok ? 1 : .4; b.style.cursor = ok ? 'pointer' : 'not-allowed'; };
  n.oninput = upd; r.onchange = upd; c.onchange = upd;
  b.onclick = async () => {
    if (b.disabled || sgBusy) return;
    sgBusy = true; b.disabled = true; b.textContent = 'Procesando…';
    try {
      const v = contracts[contracts.length - 1].v;
      const res = await api._client().rpc('sign_conditions', { p_version: v, p_name: sgName.trim(), p_role: sgRole });
      if (res.error) throw res.error;
      const ci = await api.myCafeInfo(liveReqId);
      signedOk = true; accV = v; liveCafe = { code: ci.code || '', active: !!ci.active, enabled: !!ci.enabled };

/* Historial claro de una solicitud (panel de admin), en orden cronológico inverso. */
function liveHistoryHtml(r) {
  const H = (LIVE_ADMIN.history || []).filter((h) => h.request_id === r.id);
  const items = []; let fixed = false;
  H.forEach((h) => {
    const who = esc(adminName(h.actor_email)), d = h.detail || {}, chg = d.kind === 'change';
    let t = null;
    switch (h.action) {
      case 'request_pending': t = chg ? 'El comercio envió cambios para revisar' : (fixed ? 'El comercio reenvió la solicitud con las correcciones' : 'El comercio envió la solicitud de adhesión'); break;
      case 'request_needs_fix': fixed = true; t = who + ' pidió correcciones' + (d.note ? ' · «' + esc(d.note) + '»' : ''); break;
      case 'request_approved': t = who + (chg ? ' aprobó los cambios solicitados' : ' aprobó la solicitud de adhesión'); break;
      case 'request_rejected': t = who + (chg ? ' rechazó los cambios solicitados' : ' rechazó la solicitud de adhesión') + (d.note ? ' · «' + esc(d.note) + '»' : ''); break;
      case 'merchant_signed': t = 'El comercio firmó las condiciones del servicio' + (d.version ? ' (versión ' + esc(d.version) + ')' : '') + (d.name ? ' · ' + esc(d.name) + (d.role ? ', ' + esc(d.role) : '') : ''); break;
      case 'activated_on_sign': t = 'El local quedó activo en la app (se activó al firmar)'; break;
      case 'merchant_on': t = 'El comercio activó su local para canjes'; break;
      case 'merchant_off': t = 'El comercio pausó su local (dejó de recibir canjes)'; break;
      case 'admin_on': t = who + ' activó el local en la app'; break;
      case 'admin_off': t = who + ' desactivó el local de la app'; break;
      case 'invite_created': t = who + ' creó la invitación para reclamar este local'; break;
      case 'invite_claimed': t = 'El comercio reclamó su local desde la invitación'; break;
      case 'change_direct': t = 'El comercio cambió horarios o cupo (se publicó directo)'; break;
      default: t = null;
    }
    if (t) items.push([h.at, t]);
  });
  if (r.acctAt) items.push([r.acctAt, 'El comercio creó su cuenta en el portal']);
  items.sort((a, b) => new Date(b[0]) - new Date(a[0]));

}


/* ---------- Contrato de adhesión (panel admin): versión vigente real, historial y publicación ---------- */
const clDate = (iso) => { try { const d = new Date(iso), p2 = (n) => String(n).padStart(2, '0'); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); } catch (e) { return ''; } };
function nextContractV(v) { const m = /^(\d+)\.(\d+)$/.exec(String(v || '')); return m ? m[1] + '.' + (+m[2] + 1) : ''; }
function adminContratoLive() {
  const o = LIVE_ADMIN.contract;
  if (!o || !o.current) return '<div class="top"><div><h1>Contrato de adhesión</h1><p class="muted">No pudimos cargar el contrato. Recargá la página.</p></div></div>';
  const c = o.current, el = o.eligible || 0, sc = o.signed_current || 0, sa = o.signed_any || 0;
  const pct = el ? Math.min(100, Math.round(sc / el * 100)) : 0, old = Math.max(0, sa - sc);
  return `<div class="top"><div><h1>Contrato de adhesión</h1><p class="muted">Este es el texto que ven y aceptan los comercios al firmar. Si publicás una nueva versión, la verán los comercios que firmen de ahora en adelante.</p></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h2>Versión vigente: ${esc(c.version)}</h2><p class="muted">Publicada el ${clDate(c.published_at)}</p></div><button class="btn sec sm" data-dl>Descargar PDF</button></div>
 <div style="margin-top:14px"><div style="display:flex;justify-content:space-between"><span class="muted">Firmaron la versión ${esc(c.version)}</span><b>${sc} de ${el} comercios aprobados</b></div><div class="bar"><i style="width:${pct}%"></i></div>
 ${old > 0 ? `<p class="hint" style="margin-top:8px">${old} comercio${old > 1 ? 's firmaron' : ' firmó'} una versión anterior y siguen activos con lo que aceptaron.</p>` : ''}</div></div>
 <div class="cols2"><div class="card"><h2>Publicar nueva versión</h2><p class="muted" style="margin:4px 0 12px">Editá el texto y publicalo: pasa a ser el que se muestra al firmar. Las versiones anteriores quedan guardadas.</p>
 <div class="grid g2"><div class="field"><label for="cv">Número de versión *</label><input id="cv" value="${esc(nextContractV(c.version))}"></div><div class="field"><label>Vigente desde</label><input value="Al publicar (${clDate(new Date())})" disabled></div></div>
 <div class="field"><label for="cs">Resumen de los cambios *</label><textarea id="cs" rows="2" placeholder="Ej: Se quitó la mención a precios."></textarea><div class="hint">Queda registrado en el historial de versiones.</div></div>
 <div class="field"><label for="ct">Texto del contrato *</label><textarea id="ct" rows="14" style="font-size:13px">${esc(c.body || '')}</textarea></div>
 <div style="display:flex;justify-content:flex-end"><button class="btn" data-pubc>Publicar versión</button></div></div>
 <div class="card"><h2>Historial de versiones</h2><table><tr><th>Versión</th><th>Fecha</th><th>Estado</th><th>Firmaron</th><th>Cambios</th></tr>${(o.versions || []).map((v) => `<tr><td><b>${esc(v.version)}</b></td><td>${clDate(v.published_at)}</td><td><span class="badge ${v.is_current ? 'b-aprobado' : 'b-borrador'}">${v.is_current ? 'Vigente' : 'Reemplazada'}</span></td><td>${v.accepted}</td><td>${esc(v.summary || '')}</td></tr>`).join('')}</table></div></div>`;
}
function livePublishContract() {
  const v = ($('#cv').value || '').trim(), sm = ($('#cs').value || '').trim(), tx = ($('#ct').value || '').trim();
  if (!v || !sm || !tx) { toast('Completá la versión, el resumen de cambios y el texto.'); return; }
  confirmModal({ title: '¿Publicar la versión ' + v + '?', text: 'Desde ahora este es el texto que verán y aceptarán los comercios al firmar. Los que ya firmaron conservan lo que aceptaron. La versión anterior queda guardada en el historial.', ok: 'Publicar versión',
    onOk: async () => {
      const x = await api._rpc('admin_publish_contract', { p_version: v, p_summary: sm, p_body: tx });
      if (!x.ok) { toast(x.error); return; }
      await liveLoadContract(); await liveLoadContractAdmin(); render(); toast('Versión ' + v + ' publicada. Ya es la que se muestra al firmar.');
    } });
}

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href="#"]');if(a)e.preventDefault();if(bellOpen&&!e.target.closest('.notif,[data-bell]')){bellOpen=false;render()}if(helpOpen&&!e.target.closest('.helpbox,[data-help]')){helpOpen=false;render()}});

/* Fechas en formato dd/mm/aaaa (máscara) */
function dIso(v){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v||'').trim());if(!m)return '';const d=+m[1],mo=+m[2],y=+m[3];const t=new Date(y,mo-1,d);if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return '';return m[3]+'-'+m[2]+'-'+m[1]}
document.addEventListener('input',e=>{const el=e.target;if(!el||!el.matches||!el.matches('[data-date]'))return;let d=el.value.replace(/\D/g,'').slice(0,8);let o=d.slice(0,2);if(d.length>2)o+='/'+d.slice(2,4);if(d.length>4)o+='/'+d.slice(4);el.value=o});
